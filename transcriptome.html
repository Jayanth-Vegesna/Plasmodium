<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>P. falciparum Transcriptome</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #e0e0e0; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Top Navigation Bar */
        .top-bar { flex: 0 0 auto; background: #1e1e1e; padding: 15px 25px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .left-group { display: flex; align-items: center; gap: 20px; }
        .title-area h2 { margin: 0; color: #ffffff; font-size: 1.4em; }
        .back-btn { background: #2a2a2a; color: #aaa; text-decoration: none; padding: 8px 15px; border-radius: 6px; font-size: 0.9em; border: 1px solid #444; transition: all 0.2s; font-weight: bold; }
        .back-btn:hover { background: #333; color: #fff; border-color: #64b5f6; }

        /* Dataset Link Styling */
        .dataset-link { color: #64b5f6; text-decoration: none; border-bottom: 1px dashed #64b5f6; padding-bottom: 2px; transition: all 0.2s; }
        .dataset-link:hover { color: #ffffff; border-color: #ffffff; }

        /* Main Layout */
        .main-content { flex: 1 1 auto; display: flex; overflow: hidden; position: relative; }
        
        /* Left Sidebar: Gene Directory */
        .sidebar { flex: 0 0 380px; background: #1a1a1a; border-right: 1px solid #333; display: flex; flex-direction: column; overflow: hidden; z-index: 10; }
        
        .sidebar-header { padding: 20px; background: #1e1e1e; border-bottom: 1px solid #333; flex-shrink: 0; }
        .sidebar-header input { width: 100%; padding: 10px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 6px; font-size: 0.95em; box-sizing: border-box; outline: none; margin-bottom: 10px; }
        .sidebar-header input:focus { border-color: #64b5f6; }
        .sidebar-header select { width: 100%; padding: 10px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 6px; font-size: 0.95em; box-sizing: border-box; outline: none; cursor: pointer; }
        
        .gene-list-container { padding: 15px; overflow-y: auto; flex-grow: 1; }
        
        /* Gene Cards */
        .gene-card { display: block; background: #252525; padding: 12px 15px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #333; transition: all 0.2s; cursor: pointer; position: relative; }
        .gene-card:hover { background: #2a2a2a; border-color: #64b5f6; transform: translateX(3px); }
        .gene-card.active { border-color: #ff9800; background: #2d2d2d; border-left: 4px solid #ff9800; }
        .gene-id { color: #64b5f6; font-family: monospace; font-weight: bold; font-size: 1.05em; display: block; }
        .gene-name { color: #aaa; font-size: 0.85em; display: block; margin-top: 4px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stage-badge { position: absolute; top: 12px; right: 15px; font-size: 0.7em; padding: 3px 8px; border-radius: 12px; font-weight: bold; color: #000; }
        
        /* Stage Colors */
        .stage-Ring { background-color: #64b5f6; }
        .stage-Trophozoite { background-color: #ffd54f; }
        .stage-Schizont { background-color: #ef5350; }

        /* Right Panel: Visualization */
        .viz-area { flex: 1 1 auto; background: #0f0f0f; display: flex; flex-direction: column; overflow-y: auto; padding: 30px; }
        
        .gene-details-header { display: none; background: #1e1e1e; padding: 25px; border-radius: 8px; border: 1px solid #333; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .detail-title { color: #fff; font-size: 1.8em; margin: 0 0 5px 0; }
        .detail-desc { color: #aaa; font-size: 1.1em; margin: 0 0 15px 0; }
        
        .action-links { display: flex; gap: 10px; flex-wrap: wrap; }
        .action-btn { background: #2a2a2a; color: #e0e0e0; text-decoration: none; padding: 8px 15px; border-radius: 6px; font-size: 0.9em; border: 1px solid #444; transition: 0.2s; font-weight: bold; }
        .action-btn:hover { background: #333; color: #121212; border-color: #64b5f6; background: #64b5f6; }
        
        .chart-container { display: none; background: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px solid #333; flex-grow: 1; min-height: 400px; position: relative; }
        
        #placeholder { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; color: #666; font-style: italic; font-size: 1.2em; text-align: center; }

        /* D3 Chart Styles */
        .axis text { fill: #aaa; font-size: 12px; }
        .axis path, .axis line { stroke: #444; }
        .line { fill: none; stroke: #ff9800; stroke-width: 4px; stroke-linecap: round; }
        .dot { fill: #1a1a1a; stroke: #ff9800; stroke-width: 3px; transition: r 0.2s; cursor: pointer; }
        .dot:hover { r: 8; fill: #ff9800; }
        .grid-line { stroke: #333; stroke-dasharray: 4,4; }
        .stage-bg { opacity: 0.1; }
        .stage-label { fill: #666; font-weight: bold; font-size: 14px; text-anchor: middle; letter-spacing: 2px; text-transform: uppercase; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #666; }

        /* Tooltip */
        #tooltip { position: absolute; background: rgba(15, 15, 15, 0.95); padding: 10px; border: 1px solid #ff9800; border-radius: 6px; pointer-events: none; display: none; z-index: 2000; font-size: 0.9em; box-shadow: 0px 4px 12px rgba(0,0,0,0.6); color: #fff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="left-group">
            <a href="index.html" class="back-btn">&larr; Back to Dashboard</a>
            <div class="title-area">
                <h2><i>Plasmodium falciparum</i> Transcriptome (<a href="https://plasmodb.org/plasmo/app/record/dataset/DS_416070059c" target="_blank" class="dataset-link">DAFT-Seq</a>)</h2>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="sidebar">
            <div class="sidebar-header">
                <input type="text" id="search-input" placeholder="Search by Gene ID or Name...">
                <select id="stage-filter">
                    <option value="All">All Stages</option>
                    <option value="Ring">Peak: Ring (0-8h)</option>
                    <option value="Trophozoite">Peak: Trophozoite (16-32h)</option>
                    <option value="Schizont">Peak: Schizont (40-48h)</option>
                </select>
            </div>
            <div class="gene-list-container" id="gene-list">
                </div>
        </div>
        
        <div class="viz-area">
            <div id="placeholder">
                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:15px;"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                Select a gene from the directory to view its 48-hour expression lifecycle.
            </div>

            <div class="gene-details-header" id="gene-header">
                <h3 class="detail-title" id="detail-id">Gene ID</h3>
                <p class="detail-desc" id="detail-name">Product Description</p>
                <div class="action-links">
                    <a href="#" id="link-genome" target="_blank" class="action-btn">🧬 View in Genome Browser</a>
                    <a href="#" id="link-proteome" target="_blank" class="action-btn">🔬 View 3D Structure</a>
                </div>
            </div>

            <div class="chart-container" id="chart-container">
                <div id="tooltip"></div>
            </div>
        </div>
    </div>

    <script src="GENOMIC/transcriptome_data.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (!window.TranscriptomeData) {
                document.getElementById('placeholder').innerHTML = "<span style='color:#ff5252;'>Error: GENOMIC/transcriptome_data.js not found. Please run make_transcriptome.py.</span>";
                return;
            }

            const allData = window.TranscriptomeData;
            const listContainer = document.getElementById('gene-list');
            const searchInput = document.getElementById('search-input');
            const stageFilter = document.getElementById('stage-filter');
            
            let activeGeneId = null;

            // --- 1. RENDER GENE LIST ---
            function renderList() {
                const query = searchInput.value.toLowerCase();
                const stage = stageFilter.value;
                
                listContainer.innerHTML = "";
                
                // Optimization: Slice to prevent browser lag if searching 5000+ items
                let renderedCount = 0;

                for (let i = 0; i < allData.length; i++) {
                    const d = allData[i];
                    
                    if (stage !== "All" && d.peak_stage !== stage) continue;
                    if (query && !d.id.toLowerCase().includes(query) && !d.name.toLowerCase().includes(query)) continue;
                    
                    const card = document.createElement('div');
                    card.className = `gene-card ${d.id === activeGeneId ? 'active' : ''}`;
                    card.setAttribute('data-id', d.id);
                    
                    card.innerHTML = `
                        <span class="gene-id">${d.id}</span>
                        <span class="gene-name">${d.name}</span>
                        <span class="stage-badge stage-${d.peak_stage}">${d.peak_stage}</span>
                    `;
                    
                    card.onclick = () => selectGene(d);
                    listContainer.appendChild(card);
                    
                    renderedCount++;
                    if (renderedCount > 300) break; // Display limit for performance
                }
            }

            searchInput.addEventListener('input', renderList);
            stageFilter.addEventListener('change', renderList);

            // --- 2. SELECT GENE & UPDATE UI ---
            function selectGene(geneData) {
                activeGeneId = geneData.id;
                
                // Update Cards UI
                document.querySelectorAll('.gene-card').forEach(c => c.classList.remove('active'));
                const activeCard = document.querySelector(`.gene-card[data-id="${geneData.id}"]`);
                if (activeCard) activeCard.classList.add('active');

                // Reveal Panels
                document.getElementById('placeholder').style.display = 'none';
                document.getElementById('gene-header').style.display = 'block';
                document.getElementById('chart-container').style.display = 'block';

                // Update Text & Links
                document.getElementById('detail-id').innerText = geneData.id;
                document.getElementById('detail-name').innerText = geneData.name;
                document.getElementById('link-genome').href = `genome.html?search=${geneData.id}`;
                document.getElementById('link-proteome').href = `proteome.html?search=${geneData.id}`;

                // Draw Chart
                drawChart(geneData);
            }

            // --- 3. D3.JS LINE CHART ---
            function drawChart(geneData) {
                const container = document.getElementById('chart-container');
                container.innerHTML = '<div id="tooltip"></div>'; // Reset container
                
                const width = container.clientWidth;
                const height = container.clientHeight;
                const margin = { top: 40, right: 30, bottom: 50, left: 70 };
                
                const innerWidth = width - margin.left - margin.right;
                const innerHeight = height - margin.top - margin.bottom;

                const svg = d3.select(container).append("svg")
                    .attr("width", width)
                    .attr("height", height);

                const chartGroup = svg.append("g")
                    .attr("transform", `translate(${margin.left},${margin.top})`);

                const timePoints = [0, 8, 16, 24, 32, 40, 48];
                
                // Scales
                const xScale = d3.scaleLinear()
                    .domain([0, 48])
                    .range([0, innerWidth]);

                // Pad the Y max slightly so line doesn't hit the ceiling
                const yMax = d3.max(geneData.expression) * 1.1;
                const yScale = d3.scaleLinear()
                    .domain([0, yMax])
                    .range([innerHeight, 0]);

                // --- Draw Background Stage Zones ---
                const zones = [
                    { name: "Ring", start: 0, end: 12, color: "#64b5f6" },
                    { name: "Trophozoite", start: 12, end: 36, color: "#ffd54f" },
                    { name: "Schizont", start: 36, end: 48, color: "#ef5350" }
                ];

                zones.forEach(z => {
                    // Zone Box
                    chartGroup.append("rect")
                        .attr("class", "stage-bg")
                        .attr("x", xScale(z.start))
                        .attr("y", 0)
                        .attr("width", xScale(z.end) - xScale(z.start))
                        .attr("height", innerHeight)
                        .attr("fill", z.color);
                    
                    // Zone Label
                    chartGroup.append("text")
                        .attr("class", "stage-label")
                        .attr("x", xScale(z.start + (z.end - z.start) / 2))
                        .attr("y", -10)
                        .text(z.name);
                });

                // --- Axes & Grid ---
                const yAxis = d3.axisLeft(yScale).ticks(6).tickFormat(d3.format(".1f"));
                const xAxis = d3.axisBottom(xScale).tickValues(timePoints).tickFormat(d => d + "h");

                // Horizontal Grid lines
                chartGroup.append("g")
                    .attr("class", "grid")
                    .selectAll("line")
                    .data(yScale.ticks(6))
                    .enter().append("line")
                    .attr("class", "grid-line")
                    .attr("x1", 0)
                    .attr("x2", innerWidth)
                    .attr("y1", d => yScale(d))
                    .attr("y2", d => yScale(d));

                chartGroup.append("g")
                    .attr("class", "axis")
                    .attr("transform", `translate(0,${innerHeight})`)
                    .call(xAxis);

                chartGroup.append("g")
                    .attr("class", "axis")
                    .call(yAxis);

                // Y-Axis Title
                svg.append("text")
                    .attr("transform", "rotate(-90)")
                    .attr("y", 20)
                    .attr("x", 0 - (height / 2))
                    .style("text-anchor", "middle")
                    .style("fill", "#aaa")
                    .style("font-size", "14px")
                    .style("font-weight", "bold")
                    .text("Expression (TPM)");

                // --- Draw Line ---
                const lineGenerator = d3.line()
                    .x((d, i) => xScale(timePoints[i]))
                    .y(d => yScale(d))
                    .curve(d3.curveMonotoneX); // Smooth curve

                // Line animation path
                const path = chartGroup.append("path")
                    .datum(geneData.expression)
                    .attr("class", "line")
                    .attr("d", lineGenerator);

                // Animate line drawing
                const totalLength = path.node().getTotalLength();
                path
                    .attr("stroke-dasharray", totalLength + " " + totalLength)
                    .attr("stroke-dashoffset", totalLength)
                    .transition()
                    .duration(1000)
                    .ease(d3.easeCubicOut)
                    .attr("stroke-dashoffset", 0);

                // --- Draw Dots & Tooltips ---
                const tooltip = d3.select("#tooltip");

                chartGroup.selectAll(".dot")
                    .data(geneData.expression)
                    .enter().append("circle")
                    .attr("class", "dot")
                    .attr("cx", (d, i) => xScale(timePoints[i]))
                    .attr("cy", d => yScale(d))
                    .attr("r", 0) // Start invisible for animation
                    .on("mouseover", function(event, d) {
                        const i = chartGroup.selectAll(".dot").nodes().indexOf(this);
                        tooltip.style("display", "block")
                            .html(`Hour: ${timePoints[i]}h<br>TPM: ${d.toFixed(2)}`);
                    })
                    .on("mousemove", function(event) {
                        const [x, y] = d3.pointer(event, container);
                        tooltip.style("left", (x + 15) + "px").style("top", (y - 20) + "px");
                    })
                    .on("mouseout", function() {
                        tooltip.style("display", "none");
                    })
                    .transition()
                    .delay((d, i) => i * (1000 / 7)) // Pop in sequence with the line
                    .duration(300)
                    .attr("r", 5);
            }

            // Window Resize handling for D3
            window.addEventListener('resize', () => {
                if (activeGeneId) {
                    const activeData = allData.find(d => d.id === activeGeneId);
                    if (activeData) drawChart(activeData);
                }
            });

            // Initial Render
            renderList();
        });
    </script>
</body>
</html>
