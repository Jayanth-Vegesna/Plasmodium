<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P. falciparum GO Explorer</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #e0e0e0; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        .controls { 
            background: #1e1e1e; 
            padding: 12px 25px; 
            border-bottom: 1px solid #333; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .left-group { display: flex; align-items: center; gap: 20px; }
        .title-area h2 { margin: 0; color: #ffffff; font-size: 1.3em; }
        
        .back-btn { 
            background: #2a2a2a; 
            color: #aaa; 
            text-decoration: none; 
            padding: 8px 15px; 
            border-radius: 6px; 
            font-size: 0.85em; 
            border: 1px solid #444; 
            transition: 0.2s; 
            font-weight: bold; 
        }
        .back-btn:hover { background: #333; color: #fff; border-color: #64b5f6; }

        .filter-area { display: flex; align-items: center; gap: 15px; }
        input[type="text"], select {
            padding: 8px 12px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            font-size: 0.9em;
        }
        input[type="text"] { width: 200px; cursor: text; }
        input[type="text"]:focus, select:hover { border-color: #64b5f6; }

        #main-container { position: relative; flex-grow: 1; display: flex; overflow: hidden; }
        #viz-container { flex-grow: 1; position: relative; background: #0f0f0f; cursor: grab; }
        #viz-container:active { cursor: grabbing; }
        
        /* Fixed Sidebar Styling */
        #gene-sidebar {
            width: 350px;
            background: #1a1a1a;
            border-left: 1px solid #333;
            display: flex; /* Always visible to hold placeholder */
            flex-direction: column;
            flex-shrink: 0;
            z-index: 500;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
        }

        /* Solid background padding moved here so scrolling genes don't overlap text */
        .sidebar-header { 
            position: sticky; 
            top: 0; 
            background: #1a1a1a; 
            padding: 20px 20px 15px 20px; 
            border-bottom: 1px solid #333; 
            z-index: 10;
        }
        .sidebar-content {
            padding: 15px 20px 20px 20px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .sidebar-title { color: #64b5f6; font-size: 1.2em; font-weight: bold; margin-bottom: 5px; line-height: 1.3; }
        .gene-count-label { color: #888; font-size: 0.85em; display: block; }
        .panel-placeholder { color: #666; font-style: italic; text-align: center; margin-top: 50px; line-height: 1.5; }
        
        /* Upgraded Gene Cards */
        .gene-card { 
            display: block; 
            background: #252525; 
            padding: 12px; 
            margin-bottom: 10px; 
            border-radius: 6px; 
            text-decoration: none; 
            border: 1px solid #333; 
            transition: all 0.2s; 
        }
        .gene-card:hover { background: #303030; border-color: #64b5f6; transform: translateY(-2px); }
        .gene-id { color: #64b5f6; font-family: monospace; font-weight: bold; font-size: 1.1em; display: block; }
        .gene-name { color: #e0e0e0; font-size: 0.85em; display: block; margin-top: 6px; line-height: 1.4; }

        .node { cursor: pointer; stroke-width: 1px; transition: stroke 0.2s, fill-opacity 0.2s; }
        .node:hover { fill-opacity: 1 !important; stroke: #ffffff !important; stroke-width: 2px; }
        
        #tooltip {
            position: absolute;
            background: rgba(10, 10, 10, 0.95);
            padding: 12px;
            border: 1px solid #64b5f6;
            border-radius: 6px;
            pointer-events: none;
            display: none;
            z-index: 2000;
            font-size: 0.9em;
            backdrop-filter: blur(4px);
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e1e1e; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #666; }
    </style>
</head>
<body>
    <div class="controls">
        <div class="left-group">
            <a href="index.html" class="back-btn">← Back to Dashboard</a>
            <div class="title-area">
                <h2><i>P. falciparum</i> Gene Ontology</h2>
            </div>
        </div>
        
        <div class="filter-area">
            <div>
                <label for="term-search" style="margin-right: 5px; font-size: 0.9em; color: #888;">Search Term:</label>
                <input type="text" id="term-search" list="term-options" placeholder="Select or type GO term...">
                <datalist id="term-options"></datalist>
            </div>
            <div style="margin-left: 10px;">
                <label for="category-filter" style="margin-right: 5px; font-size: 0.9em; color: #888;">Ontology:</label>
                <select id="category-filter">
                    <option value="Biological Process" selected>Biological Process</option>
                    <option value="Molecular Function">Molecular Function</option>
                    <option value="Cellular Component">Cellular Component</option>
                </select>
            </div>
        </div>
    </div>

    <div id="main-container">
        <div id="viz-container">
            <div id="tooltip"></div>
        </div>
        
        <div id="gene-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title" id="sidebar-term">GO Term Details</div>
                <span class="gene-count-label" id="gene-count">No term selected</span>
            </div>
            
            <div class="sidebar-content">
                <div id="placeholder-text" class="panel-placeholder">
                    Click a bubble or use the search bar to explore the genes in a specific ontology term.
                </div>
                <div id="gene-list"></div>
            </div>
        </div>
    </div>

    <script src="GENOMIC/go_data.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const container = document.getElementById('viz-container');
            if (!window.GOData) {
                container.innerHTML = "<h3 style='color:red; text-align:center; padding:50px;'>Error: GENOMIC/go_data.js not found. Run make_ontology.py first.</h3>";
                return;
            }

            const width = container.clientWidth;
            const height = container.clientHeight;

            // EXACT INITIALIZATION LOGIC FROM WORKING SCRIPT
            const svg = d3.select("#viz-container").append("svg")
                .attr("width", width)
                .attr("height", height)
                .call(d3.zoom().scaleExtent([0.2, 10]).on("zoom", (event) => {
                    chartGroup.attr("transform", event.transform);
                }));

            const chartGroup = svg.append("g");
            const colors = { "Biological Process": "#4caf50", "Molecular Function": "#64b5f6", "Cellular Component": "#e91e63" };
            const tooltip = d3.select("#tooltip");
            const searchInput = document.getElementById('term-search');
            const dataList = document.getElementById('term-options');
            const placeholder = document.getElementById('placeholder-text');

            let simulation;

            function highlightNode(nodeName) {
                chartGroup.selectAll(".node")
                    .attr("fill-opacity", d => d.name === nodeName ? 1 : 0.15)
                    .attr("stroke", d => d.name === nodeName ? "#fff" : d3.color(colors[d.category]).darker())
                    .attr("stroke-width", d => d.name === nodeName ? 3 : 1);
            }

            function resetHighlight() {
                chartGroup.selectAll(".node")
                    .attr("fill-opacity", 0.6)
                    .attr("stroke", d => d3.color(colors[d.category]).darker())
                    .attr("stroke-width", 1);
            }

            function updateVisualization(filterValue) {
                const filteredData = window.GOData.filter(d => d.category === filterValue);

                // Populate Dropdown Search
                dataList.innerHTML = '';
                filteredData.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.name;
                    dataList.appendChild(opt);
                });
                searchInput.value = ''; // Reset search on category change

                const radiusScale = d3.scaleSqrt()
                    .domain([0, d3.max(window.GOData, d => d.value)])
                    .range([6, 90]);

                if (simulation) simulation.stop();
                
                simulation = d3.forceSimulation(filteredData)
                    .force("center", d3.forceCenter(width / 2, height / 2))
                    .force("charge", d3.forceManyBody().strength(5))
                    .force("collide", d3.forceCollide(d => radiusScale(d.value) + 3))
                    .alphaDecay(0.02);

                const nodes = chartGroup.selectAll("circle")
                    .data(filteredData, d => d.name);

                nodes.exit().remove();

                const nodesEnter = nodes.enter().append("circle")
                    .attr("class", "node")
                    .attr("fill", d => colors[d.category])
                    .attr("fill-opacity", 0.6)
                    .attr("stroke", d => d3.color(colors[d.category]).darker());

                const allNodes = nodesEnter.merge(nodes)
                    .attr("r", d => radiusScale(d.value))
                    .on("mouseover", (event, d) => {
                        tooltip.style("display", "block")
                            .html(`<strong style="color:${colors[d.category]}">${d.name}</strong><br><strong>${d.value} Genes</strong>`);
                    })
                    .on("mousemove", (event) => {
                        const [x, y] = d3.pointer(event, container);
                        tooltip.style("left", (x + 15) + "px").style("top", (y - 20) + "px");
                    })
                    .on("mouseleave", () => tooltip.style("display", "none"))
                    .on("click", (event, d) => {
                        event.stopPropagation();
                        searchInput.value = d.name; // Update search bar
                        highlightNode(d.name);      // Highlight bubble
                        showGenes(d);
                    });

                simulation.on("tick", () => {
                    allNodes.attr("cx", d => d.x).attr("cy", d => d.y);
                });
            }

            function showGenes(d) {
                placeholder.style.display = 'none';
                document.getElementById('sidebar-term').innerText = d.name.toUpperCase();
                document.getElementById('sidebar-term').style.color = colors[d.category];
                document.getElementById('gene-count').innerText = `${d.value} Associated Genes`;
                
                const listContainer = document.getElementById('gene-list');
                listContainer.innerHTML = "";
                
                if (d.genes && Array.isArray(d.genes)) {
                    d.genes.forEach(g => {
                        let gid = typeof g === 'string' ? g : g.id;
                        let gname = typeof g === 'string' ? "" : g.name;

                        const a = document.createElement('a');
                        a.className = 'gene-card';
                        a.href = `genome.html?search=${gid}`;
                        a.target = "_blank";
                        
                        a.innerHTML = `<span class="gene-id">${gid}</span>` + 
                                      (gname ? `<span class="gene-name">${gname}</span>` : '');
                        
                        listContainer.appendChild(a);
                    });
                }
            }

            // --- Event Listeners ---
            
            // 1. Dropdown Change
            document.getElementById('category-filter').addEventListener('change', (e) => {
                updateVisualization(e.target.value);
                placeholder.style.display = 'block';
                document.getElementById('sidebar-term').innerText = "GO Term Details";
                document.getElementById('sidebar-term').style.color = "#64b5f6";
                document.getElementById('gene-count').innerText = "No term selected";
                document.getElementById('gene-list').innerHTML = "";
            });

            // 2. Search Box Clear on Click
            searchInput.addEventListener('click', (e) => {
                e.target.value = ''; // Clears the box when clicked
                resetHighlight();
            });

            // 3. Search Box Autocomplete Selection
            searchInput.addEventListener('input', (e) => {
                const val = e.target.value;
                const targetData = chartGroup.selectAll(".node").data().find(d => d.name === val);
                
                if (targetData) {
                    highlightNode(val);
                    showGenes(targetData);
                } else if (val === "") {
                    resetHighlight();
                }
            });

            // 4. Background Click (Clear highlights)
            svg.on("click", () => {
                searchInput.value = '';
                resetHighlight();
            });

            // Initial Draw
            updateVisualization("Biological Process");
        });
    </script>
</body>
</html>
