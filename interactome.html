<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>P. falciparum: Hemoglobin Digestion Network</title>
    <!-- Load Cytoscape for the Network -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <!-- Load 3Dmol for the Protein Viewer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.0.1/3Dmol-min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a0a; color: #e0e0e0; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .header { background: #151515; padding: 20px 30px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .header h1 { margin: 0; font-size: 1.5em; color: #fff; letter-spacing: 1px; }
        .header p { margin: 5px 0 0 0; color: #666; font-size: 0.9em; }
        
        #cy { flex-grow: 1; display: block; background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%); position: relative; }
        
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #4ea8de; font-size: 1.2em; font-weight: bold; pointer-events: none; }

        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background: #151515; padding: 25px; border-radius: 8px; width: 85%; max-width: 1000px; height: 85%; display: flex; flex-direction: column; position: relative; border: 1px solid #333; box-shadow: 0 10px 50px rgba(0,0,0,0.8); }
        .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 15px; }
        .modal-title { margin: 0; color: #fff; font-size: 1.6em; }
        .modal-meta-container { margin-top: 8px; font-size: 1em; color: #888; }
        .close-btn { background: none; border: none; color: #666; font-size: 2.5em; cursor: pointer; line-height: 0.8; padding: 0 10px; transition: color 0.2s; }
        .close-btn:hover { color: #fff; }
        #viewer_div { flex-grow: 1; background: #000; border-radius: 6px; position: relative; margin-top: 10px; border: 1px solid #222; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>Hemoglobin Digestion Interactome</h1>
            <p>Organic physics layout. Hub proteins are scaled and labeled based on connectivity.</p>
        </div>
        <div style="text-align: right; color: #4ea8de; font-weight: bold; font-size: 0.9em;">
            Click any node to launch 3D structure
        </div>
    </div>

    <!-- Network Canvas -->
    <div id="cy">
        <div id="loading">Simulating Protein Physics...</div>
    </div>

    <!-- 3D Viewer Modal -->
    <div id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h2 class="modal-title" id="modal-title">Protein ID</h2>
                    <div class="modal-meta-container" id="modal-meta"></div>
                </div>
                <button class="close-btn" onclick="closeViewer()">&times;</button>
            </div>
            <div id="viewer_div"></div>
        </div>
    </div>

    <!-- Load the data generated by your Python script -->
    <script src="network_data.js"></script>

    <script>
        // --- 1. INITIALIZE CYTOSCAPE ---
        var cy = cytoscape({
            container: document.getElementById('cy'),
            elements: window.NetworkData,
            
            style: [
                {
                    selector: 'node',
                    style: {
                        // Node size grows based on number of connections (degree)
                        'width': 'mapData(degree, 1, 30, 15, 75)',
                        'height': 'mapData(degree, 1, 30, 15, 75)',
                        'background-color': '#4ea8de', 
                        'label': 'data(gene)',
                        'color': '#fff',
                        'text-valign': 'bottom',
                        'text-margin-y': 8,
                        // Only show labels for proteins with > 3 connections to prevent overlap
                        'font-size': 'mapData(degree, 1, 15, 0, 14)',
                        'text-outline-width': 2,
                        'text-outline-color': '#000',
                        'z-index': 10
                    }
                },
                {
                    selector: 'edge',
                    style: {
                        'width': 1.5,
                        'line-color': '#444',
                        'opacity': 0.4,
                        'curve-style': 'haystack' // Fastest rendering for dense networks
                    }
                },
                {
                    selector: 'node:hover',
                    style: {
                        'background-color': '#00ffff',
                        'scale': 1.2,
                        'cursor': 'pointer',
                        'text-margin-y': 12
                    }
                }
            ]
        });

        // Calculate Degree (Connectivity) for the styling rules above
        cy.nodes().forEach(function(n){
            n.data('degree', n.degree());
        });

        // --- 2. CONFIGURE PHYSICS LAYOUT ---
        // 'cose' provides the organic, clumped look from your reference image
        var layout = cy.layout({
            name: 'cose',
            idealEdgeLength: 100,
            nodeOverlap: 40,
            refresh: 20,
            fit: true,
            padding: 40,
            randomize: true,
            componentSpacing: 100,
            nodeRepulsion: 600000,
            edgeElasticity: 100,
            nestingFactor: 5,
            gravity: 80,
            numIter: 1000,
            initialTemp: 200,
            coolingFactor: 0.95,
            minTemp: 1.0,
            stop: function() {
                document.getElementById('loading').style.display = 'none';
            }
        });
        
        layout.run();

        // --- 3. EVENT LISTENERS ---
        cy.on('tap', 'node', function(evt){
            var node = evt.target;
            var uid = node.id();
            var name = node.data('name');
            var gene = node.data('gene');
            
            // Path to your PDB_JS folder
            var jsPath = 'PDB_JS/' + uid + '.js';
            
            openViewer(jsPath, uid, gene, name);
        });

        // --- 4. 3DMOL VIEWER LOGIC ---
        let viewer = null;

        function openViewer(jsPath, uniprotId, geneId, proteinName) {
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('modal-title').innerText = geneId + " / " + uniprotId;
            
            document.getElementById('modal-meta').innerHTML = `
                <span style="color: #fff;">${proteinName}</span>
                <span style="margin: 0 10px; color: #555;">|</span>
                <a href="https://www.uniprot.org/uniprotkb/${uniprotId}/entry" target="_blank" style="color: #4ea8de; text-decoration: none;">🔗 UniProt Entry</a>
            `;

            if (!viewer) {
                let element = document.getElementById('viewer_div');
                viewer = $3Dmol.createViewer(element, { backgroundColor: '#000000' });
            } else {
                viewer.clear();
            }

            // Inject the script for the protein structure
            let script = document.createElement('script');
            script.src = jsPath;
            script.id = 'temp-pdb-script';
            
            let oldScript = document.getElementById('temp-pdb-script');
            if(oldScript) oldScript.remove();
            
            document.body.appendChild(script);
        }

        // Response function called by the .js structure files
        window.receivePDBData = function(uid, pdbData) {
            viewer.addModel(pdbData, "pdb");
            
            // Apply AlphaFold confidence coloring
            let colorAlphaFold = function(atom) {
                if(atom.b > 90) return '#0053d6'; 
                if(atom.b > 70) return '#65cbf3'; 
                if(atom.b > 50) return '#ffdb13'; 
                return '#ff7d45'; 
            };
            
            viewer.setStyle({}, {cartoon: {colorfunc: colorAlphaFold}});
            viewer.zoomTo();
            viewer.render();
        };

        function closeViewer() {
            document.getElementById('modal').style.display = 'none';
            if (viewer) viewer.clear();
        }
    </script>
</body>
</html>
