<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>P. falciparum Egocentric Interactome</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.0.1/3Dmol-min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #e0e0e0; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Top Navigation Bar */
        .top-bar { flex: 0 0 auto; background: #1e1e1e; padding: 15px 25px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .left-group { display: flex; align-items: center; gap: 20px; }
        .title-area h2 { margin: 0; color: #ffffff; font-size: 1.4em; }
        .back-btn { background: #2a2a2a; color: #aaa; text-decoration: none; padding: 8px 15px; border-radius: 6px; font-size: 0.9em; border: 1px solid #444; transition: all 0.2s; font-weight: bold; }
        .back-btn:hover { background: #333; color: #fff; border-color: #4ea8de; }

        /* Main Layout */
        .main-content { flex: 1 1 auto; display: flex; overflow: hidden; position: relative; }
        
        /* Visualization Area (Left) */
        #viz-container { flex: 1 1 auto; background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%); position: relative; }
        #cy { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #4ea8de; font-size: 1.2em; font-weight: bold; z-index: 2; pointer-events: none; text-align: center; }

        /* Full-Height Network Explorer Panel (Right) */
        .info-panel { flex: 0 0 420px; background: #1e1e1e; border-left: 1px solid #333; display: flex; flex-direction: column; overflow: hidden; box-shadow: -4px 0 15px rgba(0,0,0,0.5); z-index: 10; }
        
        /* Fixed Header for Selected Protein Details */
        .sidebar-header { background: #1e1e1e; padding: 25px 25px 20px 25px; border-bottom: 1px solid #333; flex-shrink: 0; z-index: 20; min-height: 100px; }
        .sidebar-title { color: #ffca28; font-weight: bold; font-size: 1.3em; margin-bottom: 5px; line-height: 1.3; }
        .sidebar-meta { color: #aaa; font-size: 0.95em; font-weight: bold; margin-bottom: 15px; }
        
        .action-links { display: flex; gap: 8px; flex-wrap: wrap; display: none; }
        .action-btn { background: #2a2a2a; color: #e0e0e0; text-decoration: none; padding: 6px 12px; border-radius: 4px; font-size: 0.85em; border: 1px solid #444; transition: 0.2s; font-weight: bold; }
        .action-btn:hover { background: #333; color: #fff; border-color: #4ea8de; }
        .genome-btn { background: #4ea8de; color: #121212; border-color: #4ea8de; }
        .genome-btn:hover { background: #5eb8e6; color: #121212; border-color: #5eb8e6; }

        /* Search & Scrollable List Area */
        .list-search-box { padding: 15px 25px; background: #151515; border-bottom: 1px solid #333; flex-shrink: 0; }
        .list-search-box input { width: 100%; padding: 10px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 6px; font-size: 0.95em; box-sizing: border-box; outline: none; transition: 0.2s; }
        .list-search-box input:focus { border-color: #4ea8de; }
        
        .sidebar-content { padding: 15px 25px; overflow-y: auto; flex-grow: 1; background: #151515; }
        
        /* Selectable Protein Cards */
        .protein-card { display: block; background: #252525; padding: 12px 15px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #333; transition: all 0.2s; cursor: pointer; }
        .protein-card:hover { background: #2a2a2a; border-color: #4ea8de; transform: translateX(3px); }
        .protein-card.active { border-color: #ffca28; background: #2a2a2a; border-left: 4px solid #ffca28; }
        .gene-id { color: #4ea8de; font-family: monospace; font-weight: bold; font-size: 1.05em; display: block; }
        .gene-name { color: #e0e0e0; font-size: 0.85em; display: block; margin-top: 4px; line-height: 1.4; }

        /* Modal Styles */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background: #151515; padding: 25px; border-radius: 8px; width: 85%; max-width: 1000px; height: 85%; display: flex; flex-direction: column; position: relative; border: 1px solid #333; box-shadow: 0 10px 50px rgba(0,0,0,0.8); box-sizing: border-box; }
        .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 15px; padding-right: 40px; }
        .modal-title { margin: 0; color: #fff; font-size: 1.6em; }
        .modal-meta-container { margin-top: 8px; font-size: 1em; color: #888; }
        .close-btn { position: absolute; top: 15px; right: 20px; background: none; border: none; color: #666; font-size: 2.5em; cursor: pointer; line-height: 0.8; padding: 5px 10px; transition: color 0.2s; z-index: 10; }
        .close-btn:hover { color: #fff; }
        #viewer_div { flex-grow: 1; background: #000; border-radius: 6px; position: relative; margin-top: 10px; border: 1px solid #222; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #666; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="left-group">
            <a href="index.html" class="back-btn">&larr; Back to Dashboard</a>
            <div class="title-area">
                <h2><i>Plasmodium falciparum</i> Egocentric Interactome</h2>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div id="viz-container">
            <div id="cy"></div>
            <div id="loading">Select a protein from the list on the right to visualize its network...</div>
        </div>
        
        <div id="interactome-sidebar" class="info-panel">
            <div class="sidebar-header" id="sidebar-header">
                <div class="sidebar-title" id="sidebar-term">Network Explorer</div>
                <div class="sidebar-meta" id="sidebar-meta">No central node selected.</div>
                <div class="action-links" id="sidebar-links">
                    </div>
            </div>
            
            <div class="list-search-box">
                <input type="text" id="list-search" placeholder="Quick filter by ID or Name...">
            </div>
            
            <div class="sidebar-content" id="protein-list">
                </div>
        </div>
    </div>

    <div id="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeViewer()">&times;</button>
            <div class="modal-header">
                <div>
                    <h2 class="modal-title" id="modal-title">Protein ID</h2>
                    <div class="modal-meta-container" id="modal-meta"></div>
                </div>
            </div>
            <div id="viewer_div"></div>
        </div>
    </div>

    <script src="INTERACT/network_data.js"></script>

    <script>
        let cy;

        document.addEventListener('DOMContentLoaded', function() {
            if (!window.NetworkData) {
                alert("Error: Could not load network_data.js. Ensure the python script ran correctly.");
                return;
            }

            // 1. Initialize Cytoscape
            cy = cytoscape({
                container: document.getElementById('cy'),
                style: [
                    {
                        selector: 'node',
                        style: {
                            'width': 45,
                            'height': 45,
                            'background-color': '#4ea8de', 
                            'label': 'data(label)',
                            'color': '#fff',
                            'text-valign': 'bottom',
                            'text-margin-y': 8,
                            'font-size': 11,
                            'text-wrap': 'wrap',
                            'text-max-width': '160px',
                            'text-outline-width': 2,
                            'text-outline-color': '#000',
                            'z-index': 10,
                            'transition-property': 'background-color, scale',
                            'transition-duration': '0.2s'
                        }
                    },
                    {
                        selector: 'node[isCenter = "true"]',
                        style: {
                            'width': 75,
                            'height': 75,
                            'background-color': '#ffca28', 
                            'font-size': 14,
                            'font-weight': 'bold',
                            'text-outline-color': '#ffca28',
                            'color': '#000',
                            'z-index': 100
                        }
                    },
                    {
                        selector: 'edge',
                        style: {
                            'width': 2,
                            'line-color': '#444',
                            'opacity': 0.6,
                            'curve-style': 'bezier'
                        }
                    },
                    {
                        selector: 'node:hover',
                        style: {
                            'background-color': '#00ffff',
                            'scale': 1.1,
                            'cursor': 'pointer'
                        }
                    }
                ]
            });

            // Tap node in network -> Open 3D Viewer Modal
            cy.on('tap', 'node', function(evt){
                var node = evt.target;
                var uid = node.id();
                var name = node.data('name');
                var gene = node.data('gene');
                var jsPath = 'PDB_JS/' + uid + '.js';
                openViewer(jsPath, uid, gene, name);
            });

            // 2. Populate Sidebar List
            const listContainer = document.getElementById('protein-list');
            let sortedNodes = Object.values(window.NetworkData.nodes).sort((a, b) => a.id.localeCompare(b.id));

            function renderList(filterText = "") {
                listContainer.innerHTML = "";
                
                const lowerFilter = filterText.toLowerCase();
                
                sortedNodes.forEach(node => {
                    // Apply Filter
                    if (filterText) {
                        const matchId = node.id.toLowerCase().includes(lowerFilter);
                        const matchName = node.name.toLowerCase().includes(lowerFilter);
                        const matchGene = (node.gene || node.plasmodb || "").toLowerCase().includes(lowerFilter);
                        if (!matchId && !matchName && !matchGene) return;
                    }

                    let plasmoId = node.plasmodb || node.gene || "";
                    let card = document.createElement('div');
                    card.className = "protein-card";
                    card.setAttribute('data-id', node.id);
                    card.innerHTML = `
                        <span class="gene-id">${node.id} ${plasmoId ? `[${plasmoId}]` : ''}</span>
                        <span class="gene-name">${node.name}</span>
                    `;
                    
                    // Click card -> Draw Network & Update Details
                    card.onclick = () => selectCentralProtein(node.id);
                    listContainer.appendChild(card);
                });
            }

            // Initial Render
            renderList();

            // Search Box Listener
            document.getElementById('list-search').addEventListener('input', (e) => {
                renderList(e.target.value.trim());
            });
        });

        // --- 3. Handle Central Protein Selection ---
        function selectCentralProtein(uid) {
            let nodeData = window.NetworkData.nodes[uid];
            if(!nodeData) return;

            // Highlight the active card in the list
            document.querySelectorAll('.protein-card').forEach(c => c.classList.remove('active'));
            let activeCard = document.querySelector(`.protein-card[data-id="${uid}"]`);
            if (activeCard) activeCard.classList.add('active');

            // Update Header Details
            let plasmoId = nodeData.plasmodb || nodeData.gene || "";
            document.getElementById('sidebar-term').innerText = nodeData.id;
            document.getElementById('sidebar-meta').innerText = nodeData.name;
            
            // Build Contextual Buttons
            let linksHtml = `<a href="https://www.uniprot.org/uniprotkb/${nodeData.id}/entry" target="_blank" class="action-btn">🔗 UniProt</a>`;
            if (plasmoId) {
                linksHtml += `<a href="https://plasmodb.org/plasmo/app/record/gene/${plasmoId}" target="_blank" class="action-btn">🔗 PlasmoDB</a>`;
                linksHtml += `<a href="genome.html?search=${plasmoId}" target="_blank" class="action-btn genome-btn">🧬 View in Genome Browser</a>`;
            }
            
            let linksDiv = document.getElementById('sidebar-links');
            linksDiv.innerHTML = linksHtml;
            linksDiv.style.display = 'flex';

            // Draw the Network
            drawEgoNetwork(uid);
        }

        function drawEgoNetwork(centerId) {
            document.getElementById('loading').style.display = 'none';
            cy.elements().remove(); 
            
            let elements = [];
            let neighbors = new Set();
            neighbors.add(centerId);

            window.NetworkData.edges.forEach(e => {
                if (e.source === centerId || e.target === centerId) {
                    neighbors.add(e.source);
                    neighbors.add(e.target);
                    elements.push({ data: { id: e.source+"-"+e.target, source: e.source, target: e.target, weight: e.weight } });
                }
            });

            neighbors.forEach(nId => {
                let nData = window.NetworkData.nodes[nId];
                if (nData) {
                    elements.push({ 
                        data: { 
                            id: nId, 
                            gene: nData.gene || nData.plasmodb || "", 
                            name: nData.name,
                            label: `${nId}\n${nData.name}`, 
                            isCenter: nId === centerId ? 'true' : 'false'
                        } 
                    });
                }
            });

            cy.add(elements);

            cy.layout({
                name: 'concentric',
                concentric: function(node){
                  return node.data('isCenter') === 'true' ? 2 : 1;
                },
                levelWidth: function(nodes){
                  return 1;
                },
                padding: 50,
                animate: true,
                animationDuration: 500
            }).run();
        }

        // --- 4. 3D Viewer Logic (Unchanged) ---
        let viewer = null;

        function openViewer(jsPath, uniprotId, geneId, proteinName) {
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('modal-title').innerText = uniprotId + " - " + proteinName;
            
            document.getElementById('modal-meta').innerHTML = `
                <span style="color: #fff; font-weight: bold;">Gene: ${geneId || 'N/A'}</span>
                <span style="margin: 0 10px; color: #555;">|</span>
                <a href="https://www.uniprot.org/uniprotkb/${uniprotId}/entry" target="_blank" style="color: #4ea8de; text-decoration: none;">🔗 View on UniProt</a>
                ${geneId ? `<span style="margin: 0 10px; color: #555;">|</span><a href="genome.html?search=${geneId}" target="_blank" style="display: inline-block; background: #4ea8de; color: #121212; padding: 2px 8px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 0.9em;">🧬 View in Genome</a>` : ''}
            `;

            if (!viewer) {
                let element = document.getElementById('viewer_div');
                viewer = $3Dmol.createViewer(element, { backgroundColor: '#000000' });
            } else {
                viewer.clear();
            }

            let script = document.createElement('script');
            script.src = jsPath;
            script.id = 'temp-pdb-script';
            
            let oldScript = document.getElementById('temp-pdb-script');
            if(oldScript) oldScript.remove();
            
            document.body.appendChild(script);
        }

        window.receivePDBData = function(uid, pdbData) {
            viewer.addModel(pdbData, "pdb");
            let colorAlphaFold = function(atom) {
                if(atom.b > 90) return '#0053d6'; 
                if(atom.b > 70) return '#65cbf3'; 
                if(atom.b > 50) return '#ffdb13'; 
                return '#ff7d45'; 
            };
            viewer.setStyle({}, {cartoon: {colorfunc: colorAlphaFold}});
            viewer.zoomTo();
            viewer.render();
        };

        function closeViewer() {
            document.getElementById('modal').style.display = 'none';
            if (viewer) viewer.clear();
        }
    </script>
</body>
</html>
