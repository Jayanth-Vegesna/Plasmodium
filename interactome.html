<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>P. falciparum Egocentric Interactome</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.0.1/3Dmol-min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #e0e0e0; margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        
        .top-bar { flex: 0 0 auto; background: #1e1e1e; padding: 15px 25px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); flex-wrap: wrap; gap: 10px; }
        .left-group { display: flex; align-items: center; gap: 20px; }
        .title-area h2 { margin: 0; color: #ffffff; font-size: 1.4em; }
        .back-btn { background: #2a2a2a; color: #aaa; text-decoration: none; padding: 8px 15px; border-radius: 6px; font-size: 0.9em; border: 1px solid #444; transition: all 0.2s; font-weight: bold; white-space: nowrap; }
        .back-btn:hover { background: #333; color: #fff; border-color: #4ea8de; }

        /* Strict flex trapping */
        .main-content { flex: 1 1 auto; min-height: 0; display: flex; overflow: hidden; position: relative; flex-direction: row; }
        
        #viz-container { flex: 1 1 auto; min-height: 0; background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%); position: relative; }
        #cy { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #4ea8de; font-size: 1.2em; font-weight: bold; z-index: 2; pointer-events: none; text-align: center; }

        .info-panel { flex: 0 0 380px; min-height: 0; background: #1e1e1e; border-left: 1px solid #333; display: flex; flex-direction: column; overflow: hidden; box-shadow: -4px 0 15px rgba(0,0,0,0.5); z-index: 10; }
        
        .sidebar-header { background: #1e1e1e; padding: 25px; border-bottom: 1px solid #333; flex: 0 0 auto; z-index: 20; }
        .sidebar-title { color: #ffca28; font-weight: bold; font-size: 1.3em; margin-bottom: 5px; line-height: 1.3; }
        .sidebar-meta { color: #aaa; font-size: 0.95em; font-weight: bold; margin-bottom: 15px; }
        
        .action-links { display: flex; gap: 8px; flex-wrap: wrap; display: none; }
        .action-btn { background: #2a2a2a; color: #e0e0e0; text-decoration: none; padding: 6px 12px; border-radius: 4px; font-size: 0.85em; border: 1px solid #444; transition: 0.2s; font-weight: bold; text-align: center; }
        .action-btn:hover { background: #444; color: #fff; border-color: #888; }

        .list-controls { padding: 15px 25px 10px 25px; background: #151515; border-bottom: 1px solid #333; flex: 0 0 auto; display: flex; flex-direction: column; gap: 10px; }
        .control-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        .toggle-group { display: flex; background: #0a0a0a; border-radius: 6px; border: 1px solid #444; overflow: hidden; flex: 1; }
        .toggle-btn { background: transparent; color: #aaa; border: none; padding: 8px 12px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 0.85em; flex: 1; }
        .toggle-btn.active { background: #333; color: #fff; border-bottom: 3px solid #ffca28; }
        
        .clear-btn { padding: 8px 12px; background: #3a1a1a; color: #ff5252; border: 1px solid #552222; border-radius: 6px; font-size: 0.85em; font-weight: bold; cursor: pointer; transition: 0.2s; display: none; }
        .clear-btn:hover { background: #ff5252; color: #fff; border-color: #ff5252; }

        .list-controls input, .list-controls select { width: 100%; padding: 10px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 6px; font-size: 0.95em; box-sizing: border-box; outline: none; transition: 0.2s; }
        .list-controls input:focus, .list-controls select:focus { border-color: #4ea8de; }
        
        .sidebar-content { padding: 10px 25px 20px 25px; overflow-y: auto; flex: 1 1 auto; min-height: 0; background: #151515; }
        
        .protein-card { display: block; background: #252525; padding: 12px 15px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #333; transition: all 0.2s; cursor: pointer; }
        .protein-card:hover { background: #2a2a2a; border-color: #4ea8de; transform: translateX(3px); }
        .protein-card.active { border-color: #ffca28; background: #2d2d2d; border-left: 4px solid #ffca28; }
        .gene-id { color: #4ea8de; font-family: monospace; font-weight: bold; font-size: 1.05em; display: block; transition: color 0.2s; }
        .protein-card.active .gene-id { color: #ffca28; }
        .gene-name { color: #e0e0e0; font-size: 0.85em; display: block; margin-top: 4px; line-height: 1.4; }

        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background: #151515; padding: 25px; border-radius: 8px; width: 85%; max-width: 1000px; height: 85%; display: flex; flex-direction: column; position: relative; border: 1px solid #333; box-shadow: 0 10px 50px rgba(0,0,0,0.8); box-sizing: border-box; }
        .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 15px; padding-right: 40px; }
        .modal-title { margin: 0; color: #fff; font-size: 1.6em; }
        .modal-meta-container { margin-top: 8px; font-size: 1em; color: #888; }
        .close-btn { position: absolute; top: 15px; right: 20px; background: none; border: none; color: #666; font-size: 2.5em; cursor: pointer; line-height: 0.8; padding: 5px 10px; transition: color 0.2s; z-index: 10; }
        .close-btn:hover { color: #fff; }
        #viewer_div { flex-grow: 1; background: #000; border-radius: 6px; position: relative; margin-top: 10px; border: 1px solid #222; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

        /* --- MOBILE OPTIMIZATION --- */
        @media (max-width: 768px) {
            .top-bar { padding: 8px 15px; gap: 8px; }
            .title-area h2 { font-size: 1.1em; }
            .back-btn { padding: 6px 10px; font-size: 0.8em; }

            .main-content { flex-direction: column; }
            
            /* Give network specific percentage, keep strictly trapped */
            #viz-container { flex: 0 0 45%; min-height: 0; border-bottom: 1px solid #333; }
            
            /* Give sidebar specific percentage, keep strictly trapped */
            .info-panel { flex: 0 0 55%; min-height: 0; width: 100%; border-left: none; }
            
            .sidebar-header { padding: 10px 15px; }
            .sidebar-title { font-size: 1.1em; }
            .sidebar-meta { font-size: 0.85em; margin-bottom: 8px; }
            .action-btn { padding: 5px 8px; font-size: 0.75em; }
            
            .list-controls { padding: 8px 15px; gap: 8px; }
            .list-controls input, .list-controls select { padding: 8px; font-size: 0.9em; }
            .toggle-btn { padding: 6px 10px; font-size: 0.8em; }
            .clear-btn { padding: 6px 10px; font-size: 0.8em; }
            
            .sidebar-content { padding: 8px 15px; }
            .protein-card { padding: 8px 10px; margin-bottom: 6px; }
            
            .modal-content { width: 95%; height: 95%; padding: 15px; }
            .close-btn { top: 5px; right: 5px; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="left-group">
            <a href="index.html" class="back-btn">&larr; Dashboard</a>
            <div class="title-area">
                <h2><i>Plasmodium falciparum</i> Interactome</h2>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div id="viz-container">
            <div id="cy"></div>
            <div id="loading">Select a protein to map its network...</div>
        </div>
        
        <div id="interactome-sidebar" class="info-panel">
            <div class="sidebar-header" id="sidebar-header">
                <div class="sidebar-title" id="sidebar-term">Network Explorer</div>
                <div class="sidebar-meta" id="sidebar-meta">No node selected.</div>
                <div class="action-links" id="sidebar-links"></div>
            </div>
            
            <div class="list-controls">
                <div class="control-row">
                    <div class="toggle-group">
                        <button id="btn-single" class="toggle-btn active" onclick="setSelectionMode('single')">Single</button>
                        <button id="btn-multi" class="toggle-btn" onclick="setSelectionMode('multi')">Multi-Select</button>
                    </div>
                    <button id="btn-clear" class="clear-btn" onclick="clearSelections()">Clear</button>
                </div>
                <select id="conf-filter" onchange="drawEgoNetwork()">
                    <option value="400" selected>Low Confidence (>0.40)</option>
                    <option value="700">Medium Confidence (>0.70)</option>
                    <option value="900">High Confidence (>0.90)</option>
                </select>
                <input type="text" id="list-search" placeholder="Filter by Symbol, Name, or ID...">
            </div>
            
            <div class="sidebar-content" id="protein-list"></div>
        </div>
    </div>

    <div id="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeViewer()">&times;</button>
            <div class="modal-header">
                <div>
                    <h2 class="modal-title" id="modal-title">Protein ID</h2>
                    <div class="modal-meta-container" id="modal-meta"></div>
                </div>
            </div>
            <div id="viewer_div"></div>
        </div>
    </div>

    <script src="INTERACT/network_data.js"></script>

    <script>
        let cy;
        let selectionMode = 'single';
        let activeCenters = new Set();

        document.addEventListener('DOMContentLoaded', function() {
            if (!window.NetworkData) return;

            cy = cytoscape({
                container: document.getElementById('cy'),
                style: [
                    {
                        selector: 'node',
                        style: {
                            'width': 45,
                            'height': 45,
                            'background-color': '#4ea8de', 
                            'label': 'data(shortLabel)',
                            'color': '#fff',
                            'text-valign': 'bottom',
                            'text-margin-y': 8,
                            'font-size': 12,
                            'text-outline-width': 2,
                            'text-outline-color': '#000',
                            'z-index': 10,
                            'transition-property': 'background-color, scale',
                            'transition-duration': '0.2s'
                        }
                    },
                    {
                        selector: 'node[isCenter = "true"]',
                        style: {
                            'width': 75,
                            'height': 75,
                            'background-color': '#ffca28', 
                            'font-size': 15,
                            'font-weight': 'bold',
                            'text-outline-color': '#ffca28',
                            'color': '#000',
                            'z-index': 100
                        }
                    },
                    {
                        selector: 'edge',
                        style: {
                            'width': 'mapData(weight, 400, 1000, 1, 5)',
                            'line-color': '#555',
                            'opacity': 0.7,
                            'curve-style': 'bezier',
                            'label': 'data(labelWeight)',
                            'font-size': 10,
                            'color': '#ddd',
                            'text-background-color': '#111',
                            'text-background-opacity': 0.85,
                            'text-background-shape': 'roundrectangle',
                            'text-background-padding': 3,
                            'text-rotation': 'autorotate'
                        }
                    },
                    {
                        selector: 'node:hover',
                        style: {
                            'background-color': '#00ffff',
                            'scale': 1.15,
                            'cursor': 'pointer'
                        }
                    },
                    {
                        selector: 'node[isCenter = "true"]:hover',
                        style: {
                            'background-color': '#ffe082',
                            'scale': 1.15,
                            'cursor': 'pointer'
                        }
                    }
                ]
            });

            cy.on('tap', 'node', function(evt){
                var node = evt.target;
                openViewer('PDB_JS/' + node.id() + '.js', node.id(), node.data('gene'), node.data('name'));
            });

            const listContainer = document.getElementById('protein-list');
            let sortedNodes = Object.values(window.NetworkData.nodes).sort((a, b) => {
                let aName = a.gene || a.plasmodb || a.id;
                let bName = b.gene || b.plasmodb || b.id;
                return aName.localeCompare(bName);
            });

            function renderList(filterText = "") {
                listContainer.innerHTML = "";
                const lowerFilter = filterText.toLowerCase();
                
                sortedNodes.forEach(node => {
                    if (filterText) {
                        const matchId = node.id.toLowerCase().includes(lowerFilter);
                        const matchName = node.name.toLowerCase().includes(lowerFilter);
                        const matchGene = (node.gene || node.plasmodb || "").toLowerCase().includes(lowerFilter);
                        if (!matchId && !matchName && !matchGene) return;
                    }

                    let primarySymbol = node.gene || node.plasmodb || node.id;
                    let card = document.createElement('div');
                    card.className = `protein-card ${activeCenters.has(node.id) ? 'active' : ''}`;
                    card.setAttribute('data-id', node.id);
                    card.innerHTML = `
                        <span class="gene-id">${primarySymbol} ${node.id !== primarySymbol ? `<span style="color:#666; font-size:0.8em; font-weight:normal;">(${node.id})</span>` : ''}</span>
                        <span class="gene-name">${node.name}</span>
                    `;
                    card.onclick = () => selectProtein(node.id);
                    listContainer.appendChild(card);
                });
            }

            renderList();
            document.getElementById('list-search').addEventListener('input', (e) => renderList(e.target.value.trim()));

            const urlParams = new URLSearchParams(window.location.search);
            const incomingSearch = urlParams.get('search');
            if (incomingSearch) {
                const targetNode = Object.values(window.NetworkData.nodes).find(n => 
                    n.id.toLowerCase() === incomingSearch.toLowerCase() || 
                    (n.plasmodb && n.plasmodb.toLowerCase() === incomingSearch.toLowerCase()) ||
                    (n.gene && n.gene.toLowerCase() === incomingSearch.toLowerCase())
                );
                
                if (targetNode) {
                    document.getElementById('list-search').value = targetNode.plasmodb || targetNode.gene || targetNode.id;
                    renderList(document.getElementById('list-search').value);
                    selectProtein(targetNode.id);
                }
            }
        });

        window.setSelectionMode = function(mode) {
            selectionMode = mode;
            document.getElementById('btn-single').classList.toggle('active', mode === 'single');
            document.getElementById('btn-multi').classList.toggle('active', mode === 'multi');
            
            if (mode === 'single' && activeCenters.size > 1) {
                const first = Array.from(activeCenters)[0];
                activeCenters.clear();
                activeCenters.add(first);
                updateUI();
                drawEgoNetwork();
            }
        };

        window.clearSelections = function() {
            activeCenters.clear();
            updateUI();
            drawEgoNetwork();
        };

        function selectProtein(uid) {
            if(!window.NetworkData.nodes[uid]) return;

            if (selectionMode === 'single') {
                if (activeCenters.has(uid) && activeCenters.size === 1) activeCenters.clear();
                else { activeCenters.clear(); activeCenters.add(uid); }
            } else {
                if (activeCenters.has(uid)) activeCenters.delete(uid);
                else activeCenters.add(uid);
            }
            
            updateUI();
            drawEgoNetwork();
        }

        function updateUI() {
            document.querySelectorAll('.protein-card').forEach(c => c.classList.remove('active'));
            activeCenters.forEach(id => {
                let activeCard = document.querySelector(`.protein-card[data-id="${id}"]`);
                if (activeCard) activeCard.classList.add('active');
            });

            document.getElementById('btn-clear').style.display = activeCenters.size > 0 ? 'block' : 'none';

            if (activeCenters.size === 0) {
                document.getElementById('sidebar-term').innerText = "Network Explorer";
                document.getElementById('sidebar-meta').innerText = "No node selected.";
                document.getElementById('sidebar-links').style.display = 'none';
            } else if (activeCenters.size === 1) {
                let singleId = Array.from(activeCenters)[0];
                let nodeData = window.NetworkData.nodes[singleId];
                let plasmoId = nodeData.plasmodb || nodeData.gene || nodeData.id;
                
                document.getElementById('sidebar-term').innerText = plasmoId;
                document.getElementById('sidebar-meta').innerText = nodeData.name;
                
                let linksHtml = `<a href="https://www.uniprot.org/uniprotkb/${nodeData.id}/entry" target="_blank" class="action-btn">UniProt</a>`;
                if (nodeData.plasmodb || nodeData.gene) {
                    linksHtml += `<a href="https://plasmodb.org/plasmo/app/record/gene/${plasmoId}" target="_blank" class="action-btn">PlasmoDB</a>`;
                    linksHtml += `<a href="genome.html?search=${plasmoId}" target="_blank" class="action-btn">Genome Browser</a>`;
                    linksHtml += `<a href="ontology.html?search=${plasmoId}" target="_blank" class="action-btn">Gene Ontology</a>`;
                }
                
                document.getElementById('sidebar-links').innerHTML = linksHtml;
                document.getElementById('sidebar-links').style.display = 'flex';
            } else {
                document.getElementById('sidebar-term').innerText = `Mapping ${activeCenters.size} Proteins`;
                document.getElementById('sidebar-meta').innerText = "Bridged network view.";
                document.getElementById('sidebar-links').style.display = 'none';
            }
        }

        window.drawEgoNetwork = function() {
            cy.elements().remove(); 
            
            if (activeCenters.size === 0) {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('loading').innerText = "Select a protein to map its network...";
                return;
            }

            document.getElementById('loading').style.display = 'none';
            let threshold = parseInt(document.getElementById('conf-filter').value);
            
            let elements = [];
            let renderedNodes = new Set();
            let addedEdges = new Set(); 

            window.NetworkData.edges.forEach(e => {
                if (e.weight < threshold) return;

                if (activeCenters.has(e.source) || activeCenters.has(e.target)) {
                    let edgeId = e.source < e.target ? `${e.source}-${e.target}` : `${e.target}-${e.source}`;
                    
                    if (!addedEdges.has(edgeId)) {
                        renderedNodes.add(e.source);
                        renderedNodes.add(e.target);
                        
                        let formattedWeight = (e.weight / 1000).toFixed(2);
                        
                        elements.push({ data: { 
                            id: edgeId, source: e.source, target: e.target, 
                            weight: e.weight, labelWeight: formattedWeight
                        } });
                        addedEdges.add(edgeId);
                    }
                }
            });

            renderedNodes.forEach(nId => {
                let nData = window.NetworkData.nodes[nId];
                if (nData) {
                    let shortSymbol = nData.gene || nData.plasmodb || nId;
                    elements.push({ 
                        data: { 
                            id: nId, gene: nData.gene || nData.plasmodb || "", name: nData.name,
                            shortLabel: shortSymbol, isCenter: activeCenters.has(nId) ? 'true' : 'false'
                        } 
                    });
                }
            });

            cy.add(elements);

            if (activeCenters.size === 1) {
                cy.layout({ name: 'concentric', concentric: node => node.data('isCenter') === 'true' ? 2 : 1, levelWidth: nodes => 1, padding: 40, animate: true, animationDuration: 400 }).run();
            } else {
                cy.layout({ name: 'cose', padding: 40, nodeRepulsion: 400000, idealEdgeLength: 60, animate: false }).run();
            }
        }

        let viewer = null;
        function openViewer(jsPath, uniprotId, geneId, proteinName) {
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('modal-title').innerText = uniprotId + " - " + proteinName;
            document.getElementById('modal-meta').innerHTML = `<span style="color: #fff; font-weight: bold;">Gene: ${geneId || 'N/A'}</span><span style="margin: 0 10px; color: #555;">|</span><a href="https://www.uniprot.org/uniprotkb/${uniprotId}/entry" target="_blank" style="color: #4ea8de; text-decoration: none;">UniProt</a>`;

            if (!viewer) { viewer = $3Dmol.createViewer(document.getElementById('viewer_div'), { backgroundColor: '#000000' }); } else { viewer.clear(); }

            let script = document.createElement('script');
            script.src = jsPath;
            script.id = 'temp-pdb-script';
            let oldScript = document.getElementById('temp-pdb-script');
            if(oldScript) oldScript.remove();
            document.body.appendChild(script);
        }

        window.receivePDBData = function(uid, pdbData) {
            viewer.addModel(pdbData, "pdb");
            let colorAlphaFold = function(atom) {
                if(atom.b > 90) return '#0053d6'; if(atom.b > 70) return '#65cbf3'; if(atom.b > 50) return '#ffdb13'; return '#ff7d45'; 
            };
            viewer.setStyle({}, {cartoon: {colorfunc: colorAlphaFold}});
            viewer.zoomTo();
            viewer.render();
        };

        function closeViewer() { document.getElementById('modal').style.display = 'none'; if (viewer) viewer.clear(); }
    </script>
</body>
</html>
