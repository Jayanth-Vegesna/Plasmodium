<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>P. falciparum Transcriptome</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #e0e0e0; margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        
        .top-bar { flex: 0 0 auto; background: #1e1e1e; padding: 15px 25px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); flex-wrap: wrap; gap: 15px; }
        .left-group { display: flex; align-items: center; gap: 20px; }
        .title-area h2 { margin: 0; color: #ffffff; font-size: 1.4em; }
        .back-btn { background: #2a2a2a; color: #aaa; text-decoration: none; padding: 8px 15px; border-radius: 6px; font-size: 0.9em; border: 1px solid #444; transition: all 0.2s; font-weight: bold; }
        .back-btn:hover { background: #333; color: #fff; border-color: #64b5f6; }
        
        .dataset-link { color: #64b5f6; text-decoration: none; border-bottom: 1px dashed #64b5f6; padding-bottom: 2px; transition: all 0.2s; }
        .dataset-link:hover { color: #ffffff; border-color: #ffffff; }

        .toggle-group { display: flex; background: #0a0a0a; border-radius: 8px; border: 1px solid #444; overflow: hidden; }
        .toggle-btn { background: transparent; color: #aaa; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 0.9em; }
        .toggle-btn.active { background: #333; color: #fff; }
        .toggle-btn#btn-daft.active { border-bottom: 3px solid #ff9800; }
        .toggle-btn#btn-sc.active { border-bottom: 3px solid #d288ed; }
        .toggle-btn#btn-line.active { border-bottom: 3px solid #4caf50; }
        .toggle-btn#btn-heat.active { border-bottom: 3px solid #f44336; }

        /* Main Layout flex trapping */
        .main-content { flex: 1 1 auto; min-height: 0; display: flex; overflow: hidden; position: relative; }
        
        .sidebar { flex: 0 0 380px; background: #1a1a1a; border-right: 1px solid #333; display: flex; flex-direction: column; overflow: hidden; min-height: 0; z-index: 10; }
        .sidebar-header { padding: 20px; background: #1e1e1e; border-bottom: 1px solid #333; flex: 0 0 auto; }
        .sidebar-header input, .sidebar-header select { width: 100%; padding: 10px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 6px; font-size: 0.95em; box-sizing: border-box; outline: none; margin-bottom: 10px; transition: 0.2s; }
        .sidebar-header input:focus, .sidebar-header select:focus { border-color: #aaa; }
        
        .selection-controls { display: flex; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; }
        .mode-btn, .clear-btn { flex: 1; min-width: 80px; padding: 8px; background: #2a2a2a; border: 1px solid #444; color: #aaa; border-radius: 6px; cursor: pointer; font-size: 0.85em; transition: 0.2s; font-weight: bold; }
        .mode-btn:hover, .clear-btn:hover { background: #333; }
        .mode-btn.active { background: #333; color: #fff; border-bottom: 3px solid #64b5f6; }
        .clear-btn { background: #3a1a1a; color: #ff5252; border-color: #552222; }
        .clear-btn:hover { background: #ff5252; color: #fff; border-color: #ff5252; }

        .gene-list-container { padding: 15px; overflow-y: auto; flex: 1 1 auto; min-height: 0; }
        
        .gene-card { display: block; background: #252525; padding: 12px 15px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #333; transition: all 0.2s; cursor: pointer; position: relative; }
        .gene-card:hover { background: #2a2a2a; transform: translateX(3px); }
        .gene-id { font-family: monospace; font-weight: bold; font-size: 1.05em; display: block; }
        .gene-name { color: #aaa; font-size: 0.85em; display: block; margin-top: 4px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stage-badge { position: absolute; top: 12px; right: 15px; font-size: 0.7em; padding: 3px 8px; border-radius: 12px; font-weight: bold; color: #000; }

        .theme-daft .gene-card:hover { border-color: #ff9800; }
        .theme-daft .gene-card.active { border-color: #ff9800; background: #2d2d2d; border-left: 4px solid #ff9800; }
        .theme-daft .gene-id { transition: color 0.2s; }
        .theme-daft .gene-card.active .gene-id { color: #ff9800; }
        .theme-daft .sidebar-header input:focus, .theme-daft .sidebar-header select:focus { border-color: #ff9800; }

        .theme-sc .gene-card:hover { border-color: #d288ed; }
        .theme-sc .gene-card.active { border-color: #d288ed; background: #2d2d2d; border-left: 4px solid #d288ed; }
        .theme-sc .gene-id { transition: color 0.2s; }
        .theme-sc .gene-card.active .gene-id { color: #d288ed; }
        .theme-sc .sidebar-header input:focus, .theme-sc .sidebar-header select:focus { border-color: #d288ed; }
        .theme-sc .stage-badge { border-radius: 4px; }

        .viz-area { flex: 1 1 auto; background: #0f0f0f; display: flex; flex-direction: column; overflow-y: auto; min-height: 0; padding: 30px; }
        
        .gene-details-header { background: #1e1e1e; padding: 25px; border-radius: 8px; border: 1px solid #333; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); flex: 0 0 auto; }
        .detail-title { color: #fff; font-size: 1.8em; margin: 0 0 5px 0; }
        .detail-desc { color: #aaa; font-size: 1.1em; margin: 0 0 15px 0; }
        
        .action-links { display: flex; gap: 10px; flex-wrap: wrap; }
        .action-btn { background: #2a2a2a; color: #e0e0e0; text-decoration: none; padding: 8px 15px; border-radius: 6px; font-size: 0.9em; border: 1px solid #444; transition: 0.2s; font-weight: bold; }
        
        .theme-daft .action-btn:hover { background: #ff9800; color: #121212; border-color: #ff9800; }
        .theme-sc .action-btn:hover { background: #d288ed; color: #121212; border-color: #d288ed; }
        
        #main-chart-area { display: none; flex-direction: column; flex: 1 1 auto; min-height: 0; }
        
        .chart-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; flex: 0 0 auto; }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.85em; color: #ccc; background: rgba(255,255,255,0.05); padding: 5px 10px; border-radius: 6px; border: 1px solid #333; }
        .legend-color { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

        .chart-container { background: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px solid #333; flex: 1 1 auto; min-height: 400px; position: relative; overflow-y: auto; overflow-x: hidden; }
        #placeholder { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; color: #666; font-style: italic; font-size: 1.2em; text-align: center; }

        .axis text { fill: #aaa; font-size: 12px; font-weight: bold; }
        .axis path, .axis line { stroke: #444; }
        .grid-line { stroke: #333; stroke-dasharray: 4,4; }
        .stage-bg { opacity: 0.1; }
        .stage-label { fill: #666; font-weight: bold; font-size: 14px; text-anchor: middle; letter-spacing: 2px; text-transform: uppercase; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

        #tooltip { position: absolute; background: rgba(15, 15, 15, 0.95); padding: 10px; border-radius: 6px; pointer-events: none; display: none; z-index: 2000; font-size: 0.9em; box-shadow: 0px 4px 12px rgba(0,0,0,0.6); color: #fff; font-weight: bold; border: 1px solid #555; }

        /* --- MOBILE OPTIMIZATION --- */
        @media (max-width: 768px) {
            .top-bar { padding: 10px 15px; gap: 10px; }
            .title-area h2 { font-size: 1.1em; }
            .toggle-btn { padding: 6px 12px; font-size: 0.8em; }
            .back-btn { padding: 6px 10px; font-size: 0.85em; }

            .main-content { flex-direction: column; }
            
            /* Sidebar gets exactly 35% of the remaining height, perfectly scrollable */
            .sidebar { flex: 0 0 35%; width: 100%; border-right: none; border-bottom: 1px solid #333; }
            .sidebar-header { padding: 10px; }
            .sidebar-header input, .sidebar-header select { padding: 8px; font-size: 0.9em; margin-bottom: 5px; }
            .selection-controls { margin-bottom: 0; }
            .mode-btn, .clear-btn { padding: 6px; font-size: 0.8em; }
            .gene-card { padding: 8px 10px; margin-bottom: 6px; }
            .gene-list-container { padding: 10px; }
            
            /* Chart gets exactly 65% of the remaining height, perfectly scrollable */
            .viz-area { flex: 0 0 65%; width: 100%; padding: 10px; box-sizing: border-box; }
            .gene-details-header { padding: 15px; margin-bottom: 10px; }
            .detail-title { font-size: 1.2em; }
            .detail-desc { font-size: 0.9em; margin-bottom: 10px; }
            .action-btn { padding: 6px 10px; font-size: 0.8em; }
            .chart-container { padding: 10px; min-height: 250px; }
        }
    </style>
</head>
<body class="theme-daft">

    <div class="top-bar">
        <div class="left-group">
            <a href="index.html" class="back-btn">&larr; Dashboard</a>
            <div class="title-area">
                <h2><i>Plasmodium falciparum</i> Transcriptome</h2>
                <div id="dataset-meta" style="font-size: 0.85em; color: #aaa; margin-top: 4px;"></div>
            </div>
        </div>
        
        <div class="toggle-group" style="width: auto;">
            <button id="btn-daft" class="toggle-btn active" onclick="switchDataset('daft')">Bulk RNA-seq</button>
            <button id="btn-sc" class="toggle-btn" onclick="switchDataset('sc')">Single-Cell (10x)</button>
        </div>
    </div>

    <div class="main-content">
        <div class="sidebar">
            <div class="sidebar-header">
                <input type="text" id="search-input" placeholder="Search by Gene ID or Name...">
                <select id="stage-filter"></select>
                <div class="selection-controls">
                    <button id="btn-mode-single" class="mode-btn active" onclick="setSelectionMode('single')">Single Select</button>
                    <button id="btn-mode-multi" class="mode-btn" onclick="setSelectionMode('multi')">Multi Select</button>
                    <button id="btn-clear-all" class="clear-btn" onclick="clearSelections()" style="display:none;">Clear</button>
                </div>
            </div>
            <div class="gene-list-container" id="gene-list"></div>
        </div>
        
        <div class="viz-area" id="viz-area">
            <div id="placeholder">
                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:15px;"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                Select one or more genes to view expression data.
            </div>

            <div class="gene-details-header" id="gene-header" style="display: none;">
                <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:15px;">
                    <div>
                        <h3 class="detail-title" id="detail-id">Gene ID</h3>
                        <p class="detail-desc" id="detail-name">Product Description</p>
                        <div class="action-links" id="action-links">
                            <a href="#" id="link-genome" target="_blank" class="action-btn">🧬 Genome</a>
                            <a href="#" id="link-proteome" target="_blank" class="action-btn">🔬 3D Structure</a>
                            <a href="#" id="link-plasmodb" target="_blank" class="action-btn">🔗 PlasmoDB</a>
                        </div>
                    </div>
                    
                    <div class="toggle-group" style="border-radius: 6px;">
                        <button id="btn-line" class="toggle-btn active" onclick="setChartType('line')">Line Chart</button>
                        <button id="btn-heat" class="toggle-btn" onclick="setChartType('heatmap')">Heatmap</button>
                    </div>
                </div>
            </div>

            <div id="main-chart-area">
                <div id="chart-legend" class="chart-legend"></div>
                <div class="chart-container" id="chart-container">
                    <div id="tooltip"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="GENOMIC/transcriptome_data.js"></script>
    <script src="GENOMIC/sc_atlas_data.js"></script>

    <script>
        // Global State
        let currentMode = 'daft'; 
        let currentChartType = 'line'; 
        let selectionMode = 'single'; 
        let activeGeneIds = new Set();
        
        const categoricalColors = d3.scaleOrdinal(d3.schemeCategory10);
        const scColorScale = d3.scaleOrdinal()
            .domain(["ring", "trophozoite", "schizont", "gametocyte (developing)", "gametocyte (female)", "gametocyte (male)"])
            .range(["#64b5f6", "#ffd54f", "#ef5350", "#ab47bc", "#ec407a", "#26a69a"]);
        
        let geneNameMap = new Map();

        document.addEventListener("DOMContentLoaded", function() {
            if (!window.TranscriptomeData && !window.ScAtlasData) return;

            if (window.TranscriptomeData) {
                window.TranscriptomeData.forEach(g => {
                    geneNameMap.set(g.id, g.name);
                });
            }

            document.getElementById('search-input').addEventListener('input', renderList);
            document.getElementById('stage-filter').addEventListener('change', renderList);

            switchDataset('daft');

            const urlParams = new URLSearchParams(window.location.search);
            const incomingSearch = urlParams.get('search');
            if (incomingSearch) {
                document.getElementById('search-input').value = incomingSearch;
                renderList(); 
                const dataset = currentMode === 'daft' ? window.TranscriptomeData : window.ScAtlasData;
                if (dataset) {
                    const targetData = dataset.find(d => 
                        d.id.toLowerCase() === incomingSearch.toLowerCase() || 
                        (d.name && d.name.toLowerCase().includes(incomingSearch.toLowerCase()))
                    );
                    if (targetData) selectGene(targetData);
                }
            }
        });

        window.switchDataset = function(mode) {
            currentMode = mode;
            document.getElementById('btn-daft').classList.toggle('active', mode === 'daft');
            document.getElementById('btn-sc').classList.toggle('active', mode === 'sc');
            document.body.className = `theme-${mode}`;

            const metaDiv = document.getElementById('dataset-meta');
            metaDiv.innerHTML = mode === 'daft' 
                ? `<a href="https://plasmodb.org/plasmo/app/record/dataset/DS_416070059c" target="_blank" class="dataset-link">Chappell et al. 2020</a>`
                : `<a href="https://www.science.org/doi/10.1126/science.adj4088" target="_blank" class="dataset-link">Dogga et al. 2024</a>`;

            buildDropdown();
            renderList();

            if (activeGeneIds.size > 0) {
                const dataset = mode === 'daft' ? window.TranscriptomeData : window.ScAtlasData;
                const validIds = new Set();
                activeGeneIds.forEach(id => {
                    if (dataset && dataset.find(d => d.id === id)) validIds.add(id);
                });
                
                activeGeneIds = validIds;
                updateUIState();
            }
        };

        window.setChartType = function(type) {
            currentChartType = type;
            document.getElementById('btn-line').classList.toggle('active', type === 'line');
            document.getElementById('btn-heat').classList.toggle('active', type === 'heatmap');
            if (activeGeneIds.size > 0) renderCurrentChart();
        };

        window.setSelectionMode = function(mode) {
            selectionMode = mode;
            document.getElementById('btn-mode-single').classList.toggle('active', mode === 'single');
            document.getElementById('btn-mode-multi').classList.toggle('active', mode === 'multi');

            if (mode === 'single' && activeGeneIds.size > 1) {
                const first = Array.from(activeGeneIds)[0];
                activeGeneIds.clear();
                activeGeneIds.add(first);
                updateUIState();
            }
        };

        window.clearSelections = function() {
            activeGeneIds.clear();
            updateUIState();
        };

        function buildDropdown() {
            const filter = document.getElementById('stage-filter');
            filter.innerHTML = `<option value="All">All Peak Stages</option>`;
            
            if (currentMode === 'daft') {
                filter.insertAdjacentHTML('beforeend', `
                    <option value="Ring">Peak: Ring (0-18h)</option>
                    <option value="Trophozoite">Peak: Trophozoite (18-30h)</option>
                    <option value="Schizont">Peak: Schizont (30-48h)</option>
                `);
            } else if (currentMode === 'sc' && window.ScAtlasStages) {
                window.ScAtlasStages.forEach(stage => {
                    filter.insertAdjacentHTML('beforeend', `<option value="${stage}">Peak: ${stage}</option>`);
                });
            }
        }

        function renderList() {
            const dataset = currentMode === 'daft' ? window.TranscriptomeData : window.ScAtlasData;
            const listContainer = document.getElementById('gene-list');
            if (!dataset) return;

            const query = document.getElementById('search-input').value.toLowerCase();
            const stageFilter = document.getElementById('stage-filter').value;
            
            listContainer.innerHTML = "";
            let renderedCount = 0;

            for (let i = 0; i < dataset.length; i++) {
                const d = dataset[i];
                if (stageFilter !== "All" && d.peak_stage !== stageFilter) continue;
                
                let actualName = d.name || geneNameMap.get(d.id) || "Uncharacterized protein";
                const matchId = d.id.toLowerCase().includes(query);
                const matchName = actualName.toLowerCase().includes(query);
                if (query && !matchId && !matchName) continue;
                
                let badgeColor = "#666", badgeTextColor = "#000";
                if (currentMode === 'daft') {
                    if(d.peak_stage === "Ring") { badgeColor = "#64b5f6"; badgeTextColor = "#000"; }
                    else if(d.peak_stage === "Trophozoite") { badgeColor = "#ffd54f"; badgeTextColor = "#000"; }
                    else if(d.peak_stage === "Schizont") { badgeColor = "#ef5350"; badgeTextColor = "#fff"; }
                } else {
                    badgeColor = scColorScale(d.peak_stage);
                    if (!["ring", "trophozoite"].includes(d.peak_stage)) badgeTextColor = "#fff";
                }

                const card = document.createElement('div');
                card.className = `gene-card ${activeGeneIds.has(d.id) ? 'active' : ''}`;
                card.setAttribute('data-id', d.id);
                
                card.innerHTML = `
                    <span class="gene-id">${d.id}</span>
                    <span class="gene-name">${actualName}</span>
                    <span class="stage-badge" style="background:${badgeColor}; color:${badgeTextColor}">${d.peak_stage}</span>
                `;
                card.onclick = () => selectGene(d);
                listContainer.appendChild(card);
                
                renderedCount++;
                if (renderedCount > 300) break; 
            }
        }

        function selectGene(geneData) {
            if (selectionMode === 'single') {
                if (activeGeneIds.has(geneData.id) && activeGeneIds.size === 1) activeGeneIds.clear();
                else { activeGeneIds.clear(); activeGeneIds.add(geneData.id); }
            } else {
                if (activeGeneIds.has(geneData.id)) activeGeneIds.delete(geneData.id);
                else activeGeneIds.add(geneData.id);
            }
            updateUIState();
            
            // Auto scroll down to the chart area on mobile!
            if (window.innerWidth <= 768 && activeGeneIds.has(geneData.id)) {
                // Wait slightly for DOM to render the block
                setTimeout(() => {
                    document.getElementById('viz-area').scrollTo({
                        top: 0,
                        behavior: 'smooth'
                    });
                }, 50);
            }
        }

        function updateUIState() {
            document.getElementById('btn-clear-all').style.display = activeGeneIds.size > 0 ? 'block' : 'none';

            document.querySelectorAll('.gene-card').forEach(c => c.classList.remove('active'));
            activeGeneIds.forEach(id => {
                const card = document.querySelector(`.gene-card[data-id="${id}"]`);
                if (card) card.classList.add('active');
            });

            if (activeGeneIds.size === 0) {
                document.getElementById('placeholder').style.display = 'flex';
                document.getElementById('gene-header').style.display = 'none';
                document.getElementById('main-chart-area').style.display = 'none';
                return;
            }

            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('gene-header').style.display = 'block';
            document.getElementById('main-chart-area').style.display = 'flex';

            updateDetailHeader();
            renderCurrentChart();
        }

        function updateDetailHeader() {
            if (activeGeneIds.size === 1) {
                const singleId = Array.from(activeGeneIds)[0];
                const dataset = currentMode === 'daft' ? window.TranscriptomeData : window.ScAtlasData;
                const gData = dataset.find(d => d.id === singleId);
                let actualName = gData.name || geneNameMap.get(gData.id) || "Uncharacterized protein";

                document.getElementById('detail-id').innerText = gData.id;
                document.getElementById('detail-name').innerText = actualName;
                document.getElementById('link-genome').href = `genome.html?search=${gData.id}`;
                document.getElementById('link-proteome').href = `proteome.html?search=${gData.id}`;
                document.getElementById('link-plasmodb').href = `https://plasmodb.org/plasmo/app/record/gene/${gData.id}`;
                document.getElementById('action-links').style.display = 'flex';
            } else {
                document.getElementById('detail-id').innerText = `Comparing ${activeGeneIds.size} Genes`;
                document.getElementById('detail-name').innerText = "Multiple genes selected.";
                document.getElementById('action-links').style.display = 'none';
            }
        }

        function renderCurrentChart() {
            const dataset = currentMode === 'daft' ? window.TranscriptomeData : window.ScAtlasData;
            const activeGenesData = Array.from(activeGeneIds).map(id => dataset.find(d => d.id === id)).filter(Boolean);
            
            const legendContainer = document.getElementById('chart-legend');
            
            if (currentChartType === 'line') {
                if (activeGenesData.length > 1) {
                    let legendHTML = '';
                    activeGenesData.forEach((gene, idx) => {
                        const color = categoricalColors(idx);
                        let shortName = gene.name || geneNameMap.get(gene.id) || "";
                        if(shortName.length > 20) shortName = shortName.substring(0, 20) + '..';
                        legendHTML += `<div class="legend-item"><span class="legend-color" style="background:${color}"></span>${gene.id} ${shortName ? `(${shortName})` : ''}</div>`;
                    });
                    legendContainer.innerHTML = legendHTML;
                    legendContainer.style.display = 'flex';
                } else {
                    legendContainer.style.display = 'none';
                    legendContainer.innerHTML = '';
                }

                currentMode === 'daft' ? drawDaftLineChart(activeGenesData) : drawScLineChart(activeGenesData);
            } else {
                legendContainer.style.display = 'none';
                legendContainer.innerHTML = '';
                const labels = currentMode === 'daft' ? ['0h', '8h', '16h', '24h', '32h', '40h', '48h'] : window.ScAtlasStages;
                drawHeatmap(activeGenesData, labels);
            }
        }

        function drawHeatmap(genesData, labels) {
            const container = document.getElementById('chart-container');
            container.innerHTML = '<div id="tooltip"></div>';
            const width = container.clientWidth;
            const cellHeight = 45;
            const numGenes = genesData.length;
            const margin = { top: 60, right: 30, bottom: 100, left: window.innerWidth < 768 ? 120 : 180 };
            
            const innerHeight = numGenes * cellHeight;
            const height = Math.max(container.clientHeight, innerHeight + margin.top + margin.bottom);
            const innerWidth = width - margin.left - margin.right;

            const svg = d3.select(container).append("svg").attr("width", width).attr("height", height);
            const chartGroup = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);
            const cellWidth = innerWidth / labels.length;

            let heatData = [];
            let maxZ = 0;

            genesData.forEach((g, rowIdx) => {
                const mean = d3.mean(g.expression);
                const stdDev = d3.deviation(g.expression) || 1; 
                g.expression.forEach((val, colIdx) => {
                    const z = (val - mean) / stdDev;
                    if (Math.abs(z) > maxZ) maxZ = Math.abs(z);
                    heatData.push({ id: g.id, name: g.name || geneNameMap.get(g.id), stage: labels[colIdx], value: val, zScore: z, rowIdx: rowIdx, colIdx: colIdx });
                });
            });

            maxZ = Math.max(maxZ, 1); 
            const colorScale = d3.scaleLinear().domain([-maxZ, 0, maxZ]).range(["#2196f3", "#1a1a1a", "#f44336"]);

            chartGroup.selectAll(".heat-cell").data(heatData).enter().append("rect").attr("class", "heat-cell")
                .attr("x", d => d.colIdx * cellWidth).attr("y", d => d.rowIdx * cellHeight)
                .attr("width", cellWidth).attr("height", cellHeight).attr("fill", d => colorScale(d.zScore))
                .attr("stroke", "#333").attr("stroke-width", 1)
                .on("mouseover", function(event, d) {
                    d3.select(this).attr("stroke", "#fff").attr("stroke-width", 2);
                    const tooltip = d3.select("#tooltip");
                    tooltip.style("display", "block").html(`<strong>Gene:</strong> ${d.id}<br><strong>Stage:</strong> ${d.stage}<br><strong>Raw:</strong> ${d.value.toFixed(3)}<br><strong style="color:${d.zScore>0?'#f44336':'#2196f3'}">Z-Score: ${d.zScore.toFixed(2)}</strong>`);
                })
                .on("mousemove", function(event) {
                    const [x, y] = d3.pointer(event, container);
                    d3.select("#tooltip").style("left", (x + 15) + "px").style("top", (y - 20) + "px");
                })
                .on("mouseout", function() {
                    d3.select(this).attr("stroke", "#333").attr("stroke-width", 1);
                    d3.select("#tooltip").style("display", "none");
                });

            chartGroup.selectAll(".heat-label-x").data(labels).enter().append("text").attr("class", "heat-label-x")
                .attr("x", (d, i) => i * cellWidth + cellWidth / 2).attr("y", innerHeight + 25)
                .attr("text-anchor", "end").attr("fill", "#aaa").attr("font-size", "12px").attr("font-weight", "bold")
                .attr("transform", (d, i) => `rotate(-45, ${i * cellWidth + cellWidth / 2}, ${innerHeight + 25})`).text(d => d);

            chartGroup.selectAll(".heat-label-y").data(genesData).enter().append("text").attr("class", "heat-label-y")
                .attr("x", -15).attr("y", (d, i) => i * cellHeight + cellHeight / 2 + 5)
                .attr("text-anchor", "end").attr("fill", "#e0e0e0").attr("font-size", "11px").attr("font-family", "monospace")
                .text(d => {
                    let shortName = d.name || geneNameMap.get(d.id) || "";
                    let limit = window.innerWidth < 768 ? 10 : 15;
                    if(shortName.length > limit) shortName = shortName.substring(0, limit) + '..';
                    return `${d.id} ${shortName ? '('+shortName+')' : ''}`;
                });

            const defs = svg.append("defs");
            const linearGradient = defs.append("linearGradient").attr("id", "heat-gradient").attr("x1", "0%").attr("y1", "0%").attr("x2", "100%").attr("y2", "0%");
            linearGradient.append("stop").attr("offset", "0%").attr("stop-color", "#2196f3");
            linearGradient.append("stop").attr("offset", "50%").attr("stop-color", "#1a1a1a");
            linearGradient.append("stop").attr("offset", "100%").attr("stop-color", "#f44336");

            const legendWidth = Math.min(250, width - 40);
            svg.append("rect").attr("x", margin.left).attr("y", 15).attr("width", legendWidth).attr("height", 8).style("fill", "url(#heat-gradient)").style("border-radius", "4px");
            svg.append("text").attr("x", margin.left).attr("y", 10).attr("fill", "#aaa").attr("font-size", "10px").text(`-${maxZ.toFixed(1)}`);
            svg.append("text").attr("x", margin.left + legendWidth/2).attr("y", 10).attr("fill", "#aaa").attr("font-size", "10px").attr("text-anchor", "middle").text("Z-Score");
            svg.append("text").attr("x", margin.left + legendWidth).attr("y", 10).attr("fill", "#aaa").attr("font-size", "10px").attr("text-anchor", "end").text(`+${maxZ.toFixed(1)}`);
        }

        function drawDaftLineChart(genesData) {
            const container = document.getElementById('chart-container');
            container.innerHTML = '<div id="tooltip"></div>'; 
            const width = container.clientWidth;
            const height = container.clientHeight;
            const margin = { top: 40, right: 30, bottom: 50, left: 50 };
            const innerWidth = width - margin.left - margin.right;
            const innerHeight = height - margin.top - margin.bottom;

            const svg = d3.select(container).append("svg").attr("width", width).attr("height", height);
            const chartGroup = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

            const timePoints = [0, 8, 16, 24, 32, 40, 48];
            const xScale = d3.scaleLinear().domain([0, 48]).range([0, innerWidth]);

            const globalMax = d3.max(genesData, g => d3.max(g.expression)) * 1.1 || 1;
            const yScale = d3.scaleLinear().domain([0, globalMax]).range([innerHeight, 0]);

            const zones = [{ name: "Ring", start: 0, end: 18, color: "#64b5f6" }, { name: "Troph", start: 18, end: 30, color: "#ffd54f" }, { name: "Schizont", start: 30, end: 48, color: "#ef5350" }];

            zones.forEach(z => {
                chartGroup.append("rect").attr("class", "stage-bg").attr("x", xScale(z.start)).attr("y", 0).attr("width", xScale(z.end) - xScale(z.start)).attr("height", innerHeight).attr("fill", z.color);
                chartGroup.append("text").attr("class", "stage-label").attr("x", xScale(z.start + (z.end - z.start) / 2)).attr("y", -10).text(z.name).attr("font-size", window.innerWidth < 768 ? "10px" : "14px");
            });

            const yAxis = d3.axisLeft(yScale).ticks(6).tickFormat(d3.format(".0f"));
            const xAxis = d3.axisBottom(xScale).tickValues(timePoints).tickFormat(d => d + "h");

            chartGroup.append("g").attr("class", "grid").selectAll("line").data(yScale.ticks(6)).enter().append("line").attr("class", "grid-line").attr("x1", 0).attr("x2", innerWidth).attr("y1", d => yScale(d)).attr("y2", d => yScale(d));
            chartGroup.append("g").attr("class", "axis").attr("transform", `translate(0,${innerHeight})`).call(xAxis);
            chartGroup.append("g").attr("class", "axis").call(yAxis);

            const lineGen = d3.line().x((d, i) => xScale(timePoints[i])).y(d => yScale(d)).curve(d3.curveMonotoneX);
            const tooltip = d3.select("#tooltip");

            genesData.forEach((gene, idx) => {
                const color = genesData.length === 1 ? "#ff9800" : categoricalColors(idx);
                chartGroup.append("path").datum(gene.expression).attr("fill", "none").attr("stroke", color).attr("stroke-width", 3).attr("d", lineGen);
                chartGroup.selectAll(".dot-" + idx).data(gene.expression).enter().append("circle").attr("cx", (d, i) => xScale(timePoints[i])).attr("cy", d => yScale(d)).attr("r", 5).attr("fill", "#1a1a1a").attr("stroke", color).attr("stroke-width", 2).style("cursor", "pointer")
                    .on("mouseover", function(event, d) {
                        d3.select(this).attr("r", 8).attr("fill", color);
                        const i = chartGroup.selectAll(".dot-" + idx).nodes().indexOf(this);
                        tooltip.style("display", "block").html(`<strong>${gene.id}</strong><br>Hour: ${timePoints[i]}h<br>TPM: ${d.toFixed(2)}`);
                    }).on("mousemove", function(event) {
                        const [x, y] = d3.pointer(event, container);
                        tooltip.style("left", (x + 15) + "px").style("top", (y - 20) + "px");
                    }).on("mouseout", function() {
                        d3.select(this).attr("r", 5).attr("fill", "#1a1a1a");
                        tooltip.style("display", "none");
                    });
            });
        }

        function drawScLineChart(genesData) {
            const container = document.getElementById('chart-container');
            container.innerHTML = '<div id="tooltip"></div>';
            const stages = window.ScAtlasStages;
            const width = container.clientWidth;
            const height = container.clientHeight;
            const margin = { top: 40, right: 30, bottom: 120, left: 50 }; 
            const innerWidth = width - margin.left - margin.right;
            const innerHeight = height - margin.top - margin.bottom;

            const svg = d3.select(container).append("svg").attr("width", width).attr("height", height);
            const chartGroup = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);
            const xScale = d3.scalePoint().domain(stages).range([0, innerWidth]).padding(0.5);

            const globalMax = d3.max(genesData, g => d3.max(g.expression)) * 1.1 || 1; 
            const yScale = d3.scaleLinear().domain([0, globalMax]).range([innerHeight, 0]);

            chartGroup.append("g").attr("class", "grid").selectAll("line").data(yScale.ticks(5)).enter().append("line").attr("class", "grid-line").attr("x1", 0).attr("x2", innerWidth).attr("y1", d => yScale(d)).attr("y2", d => yScale(d));
            const yAxis = d3.axisLeft(yScale).ticks(5).tickFormat(d3.format(".1f"));
            const xAxis = d3.axisBottom(xScale);

            chartGroup.append("g").attr("class", "axis").attr("transform", `translate(0,${innerHeight})`).call(xAxis).selectAll("text").style("text-anchor", "end").attr("dx", "-.8em").attr("dy", ".15em").attr("transform", "rotate(-45)");
            chartGroup.append("g").attr("class", "axis").call(yAxis);

            const lineGen = d3.line().x((d, i) => xScale(stages[i])).y(d => yScale(d)).curve(d3.curveMonotoneX);
            const tooltip = d3.select("#tooltip");

            genesData.forEach((gene, idx) => {
                const color = genesData.length === 1 ? "#d288ed" : categoricalColors(idx);
                chartGroup.append("path").datum(gene.expression).attr("fill", "none").attr("stroke", color).attr("stroke-width", 3).attr("d", lineGen);
                chartGroup.selectAll(".dot-" + idx).data(gene.expression).enter().append("circle").attr("cx", (d, i) => xScale(stages[i])).attr("cy", d => yScale(d)).attr("r", 5).style("fill", "#121212").style("stroke", color).style("stroke-width", 2).style("cursor", "pointer")
                    .on("mouseover", function(event, d) {
                        const i = chartGroup.selectAll(".dot-" + idx).nodes().indexOf(this);
                        d3.select(this).attr("r", 8).style("fill", color);
                        tooltip.style("display", "block").html(`<strong>${gene.id}</strong><br>Stage: ${stages[i]}<br>Value: ${d.toFixed(3)}`);
                    }).on("mousemove", function(event) {
                        const [x, y] = d3.pointer(event, container);
                        tooltip.style("left", (x + 15) + "px").style("top", (y - 20) + "px");
                    }).on("mouseout", function() {
                        d3.select(this).attr("r", 5).style("fill", "#121212");
                        tooltip.style("display", "none");
                    });
            });
        }

        window.addEventListener('resize', () => { if (activeGeneIds.size > 0) renderCurrentChart(); });
    </script>
</body>
</html>
