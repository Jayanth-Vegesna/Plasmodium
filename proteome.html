
<!DOCTYPE html>
<html>

    <style>

        .header-flex { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 20px; }
        
        .back-btn { display: inline-block; background: #2a2a2a; color: #aaa; text-decoration: none; padding: 8px 15px; border-radius: 6px; font-size: 0.9em; margin-bottom: 15px; border: 1px solid #444; transition: all 0.2s; font-weight: bold; }
        .back-btn:hover { background: #333; color: #fff; border-color: #64b5f6; }
        
        .title-area h2 { margin: 0 0 15px 0; color: #ffffff; font-size: 1.4em; }
        
        .filter-group { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; width: 100%; max-width: 800px; }

        input[type="text"] { flex: 2; min-width: 200px; }
        input[type="text"]:focus, select:focus { border-color: #64b5f6; outline: none; }
        
        .select-wrapper { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 220px; }
        .select-wrapper label { color: #aaa; font-weight: bold; font-size: 0.9em; white-space: nowrap; }
        .select-wrapper select { width: 100%; cursor: pointer; }
        
        .stats-container { display: flex; gap: 15px; background: #2a2a2a; padding: 15px; border-radius: 8px; border: 1px solid #444; }
        .stat-box { display: flex; flex-direction: column; align-items: center; min-width: 120px; }
        .stat-value { font-size: 1.4em; font-weight: bold; color: #64b5f6; }
        .stat-label { font-size: 0.85em; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        
        .card { background: #1e1e1e; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #333; cursor: pointer; position: relative; content-visibility: auto; contain-intrinsic-size: 250px 320px; transition: transform 0.2s, border-color 0.2s; will-change: transform; }

        .plasmodb-id { font-size: 0.85em; color: #64b5f6; margin-top: 4px; display: block; font-weight: bold; font-family: monospace; letter-spacing: 0.5px; }
        .name { display: block; color: #aaa; font-size: 0.85em; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .score { font-size: 0.95em; font-weight: bold; margin-top: 10px; display: block; }
        .high { color: #4caf50; }
        .medium { color: #ffeb3b; }
        .low { color: #ff9800; }
        
        #search-hits { display: block; margin-top: 10px; color: #64b5f6; font-size: 0.9em; font-weight: bold; min-height: 1.2em; }
        
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1e1e1e; padding: 20px; border-radius: 12px; width: 80%; max-width: 900px; height: 80%; display: flex; flex-direction: column; position: relative; border: 1px solid #444; }
        .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 15px; padding-right: 40px; }
        .modal-title { margin: 0; color: #fff; font-size: 1.5em; }
        .modal-meta-container { margin-top: 8px; font-size: 0.95em; display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
        
        .close-btn { position: absolute; top: 15px; right: 20px; background: none; border: none; color: #aaa; font-size: 2em; cursor: pointer; line-height: 1; padding: 5px; transition: color 0.2s; z-index: 10; }
        .close-btn:hover { color: #fff; }
        
        #viewer_div { flex-grow: 1; background: #121212; border-radius: 8px; position: relative; margin-top: 10px; }
        .loading-text { color: #64b5f6; font-weight: bold; margin-top: 10px; }

        #sentinel { height: 50px; width: 100%; margin-top: 20px; }

        @media (max-width: 768px) {
            body { padding: 10px; }

            .stat-box { min-width: 45%; margin-bottom: 5px; }

        }

 30.09, "file": "RENDER_OUT/Q8IBU8_30.09.png", "name": "Uncharacterized protein", "js_file": "PDB_JS/Q8IBU8.js"}, {"id": "Q8IK98", "plasmodb": "PF3D7_1474000", "score": 30.08, "file": "RENDER_OUT/Q8IK98_30.08.png", "name": "Uncharacterized protein", "js_file": "PDB_JS/Q8IK98.js"}, {"id": "A0A5K1K895", "plasmodb": "PF3D7_0615900", "score": 29.94, "file": "RENDER_OUT/A0A5K1K895_29.94.png", "name": "Protein phosphatase, putative", "js_file": "PDB_JS/A0A5K1K895.js"}, {"id": "Q8I3C9", "plasmodb": "PF3D7_0901900", "score": 29.79, "file": "RENDER_OUT/Q8I3C9_29.79.png", "name": "Uncharacterized protein", "js_file": "PDB_JS/Q8I3C9.js"}, {"id": "C6KSU3", "plasmodb": "PF3D7_0609600", "score": 29.51, "file": "RENDER_OUT/C6KSU3_29.51.png", "name": "Uncharacterized protein", "js_file": "PDB_JS/C6KSU3.js"}, {"id": "Q8IHX0", "plasmodb": "PF3D7_1139600", "score": 29.49, "file": "RENDER_OUT/Q8IHX0_29.49.png", "name": "Uncharacterized protein", "js_file": "PDB_JS/Q8IHX0.js"}, {"id": "Q8IL47", "plasmodb": "PF3D7_1442400", "score": 29.3, "file": "RENDER_OUT/Q8IL47_29.30.png", "name": "Uncharacterized protein", "js_file": "PDB_JS/Q8IL47.js"}, {"id": "Q8I3F7", "plasmodb": "PF3D7_0531100", "score": 28.88, "file": "RENDER_OUT/Q8I3F7_28.88.png", "name": "Uncharacterized protein", "js_file": "PDB_JS/Q8I3F7.js"}, {"id": "Q8I2G4", "plasmodb": "PF3D7_0935600", "score": 27.56, "file": "RENDER_OUT/Q8I2G4_27.56.png", "name": "Gametocytogenesis-implicated protein", "js_file": "PDB_JS/Q8I2G4.js"}, {"id": "Q8IKC2", "plasmodb": "PF3D7_1471700", "score": 26.98, "file": "RENDER_OUT/Q8IKC2_26.98.png", "name": "Uncharacterized protein", "js_file": "PDB_JS/Q8IKC2.js"}];
        let filteredData = [...allData]; 
        let currentIndex = 0;
        const CHUNK_SIZE = 50; 

        function renderChunk() {
            const chunk = filteredData.slice(currentIndex, currentIndex + CHUNK_SIZE);
            if (chunk.length === 0) return;

            let html = "";
            chunk.forEach(item => {
                let scoreClass = item.score >= 70 ? 'high' : (item.score >= 50 ? 'medium' : 'low');
                let safeName = item.name.replace(/'/g, "\\'");
                
                let plasmoText = item.plasmodb ? `<span class="plasmodb-id">${item.plasmodb}</span>` : "";
                
                html += `
                <div class="card" onclick="openViewer('${item.js_file}', '${item.id}', '${safeName}', ${item.score}, '${item.plasmodb}')">
                    <img loading="lazy" decoding="async" src="${item.file}" alt="${item.id}" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100%\' height=\'100%\'><rect width=\'100%\' height=\'100%\' fill=\'#333\'/><text x=\'50%\' y=\'50%\' fill=\'#888\' font-family=\'sans-serif\' font-size=\'14\' text-anchor=\'middle\' dominant-baseline=\'middle\'>Render Failed</text></svg>';">
                    <span class="id">${item.id}</span>
                    ${plasmoText}
                    <span class="name" title="${item.name}">${item.name}</span>
                    <span class="score ${scoreClass}">
                        pLDDT: ${item.score}
                    </span>
                </div>`;
            });

            document.getElementById('proteinGrid').insertAdjacentHTML('beforeend', html);
            currentIndex += CHUNK_SIZE;
        }

        function applyFilter() {
            const query = document.getElementById('search').value.toUpperCase();
            const scoreFilter = document.getElementById('filter-score').value;
            const sortOrder = document.getElementById('sort-order').value;

            filteredData = allData.filter(d => {
                const matchesText = !query || 
                                    d.id.toUpperCase().includes(query) || 
                                    d.name.toUpperCase().includes(query) ||
                                    (d.plasmodb && d.plasmodb.toUpperCase().includes(query));
                
                let matchesScore = true;
                if (scoreFilter === 'very_high') matchesScore = d.score >= 90;
                else if (scoreFilter === 'confident') matchesScore = d.score >= 70 && d.score < 90;
                else if (scoreFilter === 'low') matchesScore = d.score >= 50 && d.score < 70;
                else if (scoreFilter === 'very_low') matchesScore = d.score < 50;

                return matchesText && matchesScore;
            });

            filteredData.sort((a, b) => {
                if (sortOrder === 'score_desc') return b.score - a.score;
                if (sortOrder === 'score_asc') return a.score - b.score;
                if (sortOrder === 'name_asc') return a.name.localeCompare(b.name);
                if (sortOrder === 'name_desc') return b.name.localeCompare(a.name);
                return 0;
            });

            document.getElementById('proteinGrid').innerHTML = "";
            currentIndex = 0;
            renderChunk();

            const hitsDisplay = document.getElementById('search-hits');
            hitsDisplay.innerText = "Showing " + filteredData.length + " proteins";
        }

        let searchTimeout = null;
        function handleSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(applyFilter, 250);
        }

        let viewer = null;
        function openViewer(jsPath, uniprotId, proteinName, plddtScore, plasmodbId) {
            document.getElementById('modal').style.display = 'flex';
            
            let displayTitle = uniprotId + " - " + proteinName;
            if(plasmodbId) displayTitle = uniprotId + " (" + plasmodbId + ") - " + proteinName;
            document.getElementById('modal-title').innerText = displayTitle;
            
            let quality = "Very Low (Disordered)";
            let scoreColor = "#ff9800"; 
            if (plddtScore >= 90) { quality = "Very High"; scoreColor = "#4caf50"; } 
            else if (plddtScore >= 70) { quality = "Confident"; scoreColor = "#65cbf3"; } 
            else if (plddtScore >= 50) { quality = "Low"; scoreColor = "#ffdb13"; }

            document.getElementById('modal-meta').innerHTML = `
                <span style="color: ${scoreColor}; font-weight: bold;">Average pLDDT: ${plddtScore} (${quality})</span>
                <span style="margin: 0 10px; color: #555;">|</span>
                <a href="https://www.uniprot.org/uniprotkb/${uniprotId}/entry" target="_blank" style="color: #64b5f6; text-decoration: none;">🔗 View on UniProt</a>
            `;

            document.getElementById('status').innerText = "Loading structure data...";

            if (!viewer) {
                viewer = $3Dmol.createViewer(document.getElementById('viewer_div'), { backgroundColor: '#121212' });
            } else {
                viewer.clear();
            }

            let script = document.createElement('script');
            script.src = jsPath;
            script.id = 'temp-pdb-script';
            if(document.getElementById('temp-pdb-script')) document.getElementById('temp-pdb-script').remove();
            document.body.appendChild(script);
        }

        window.receivePDBData = function(uid, pdbData) {
            document.getElementById('status').innerText = "";
            viewer.addModel(pdbData, "pdb");
            let colorAlphaFold = (atom) => {
                if(atom.b > 90) return '#0053d6'; 
                if(atom.b > 70) return '#65cbf3'; 
                if(atom.b > 50) return '#ffdb13'; 
                return '#ff7d45'; 
            };
            viewer.setStyle({}, {cartoon: {colorfunc: colorAlphaFold}});
            viewer.zoomTo();
            viewer.render();
        };

        function closeViewer() {
            document.getElementById('modal').style.display = 'none';
            if (viewer) viewer.clear();
        }

        const observer = new IntersectionObserver(entries => {
            if(entries[0].isIntersecting) {
                renderChunk();
            }
        }, { rootMargin: "300px" }); 

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const incomingSearch = urlParams.get('search');
            if (incomingSearch) {
                document.getElementById('search').value = incomingSearch;
                applyFilter();
            } else {
                renderChunk();
            }
            
            observer.observe(document.getElementById('sentinel'));
        });
    </script>
